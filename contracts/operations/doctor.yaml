operation: doctor
version: 1
purpose: 输出安装、版本、profile、policy、contract、adapter 和 workspace 的本地诊断结果。
task_type: diagnosis
allowed_stages:
  - installed
  - workspace_initialized
  - failed
required_inputs:
  - workspace
optional_inputs:
  - install_dir
input:
  workspace:
    type: string
    required: true
  install_dir:
    type: string
    required: false
preconditions:
  - workspace_name_must_be_known
output:
  workspace:
    type: string
  version:
    type: string
  version_state:
    type: string
  iteration_version:
    type: string
  commit:
    type: string
  status:
    type: string
  checks:
    type: object
  next_action:
    type: string
failure:
  codes:
    - missing_workspace
    - diagnosis_failed
side_effects:
  - must_not_write_jira
  - must_not_modify_profile
  - must_not_modify_policy
  - must_not_modify_code
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: installed
redo_from_stage: installed
