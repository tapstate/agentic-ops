operation: check_ci_status
version: 1
purpose: 通过 GitHub CLI 读取拉取请求 CI 检查状态。
task_type: ci_check
allowed_stages:
  - pr_created
  - ci_running
  - changes_requested
required_inputs:
  - workspace
  - repo
  - pr
input:
  workspace:
    type: string
    required: true
  repo:
    type: string
    required: true
  pr:
    type: string
    required: true
preconditions:
  - github_cli_must_be_available
  - github_auth_must_be_valid
  - pr_checks_must_be_readable
output:
  workspace:
    type: string
  repo:
    type: string
  pr:
    type: string
  status:
    type: string
  checks:
    type: array
  failing_checks:
    type: array
  failing_checks_count:
    type: integer
  current_stage:
    type: string
  next_action:
    type: string
failure:
  codes:
    - missing_pr_reference
    - github_ci_read_failed
side_effects:
  - must_not_write_github
  - must_not_modify_git
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: ci_running
redo_from_stage: ci_running
