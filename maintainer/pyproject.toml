[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-ops-maintainer"
version = "0.1.0"
description = "AgenticOps 项目维护工作面的 Python Runtime"
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "TapData" }]
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
ao-maint = "ao_maint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["runtime/src/ao_maint"]

[tool.uv]
package = true
