schema_version: 1

story_categories:
  - maintainer
  - developer

stories:
  - story_id: PM-001
    category: maintainer
    title: 维护故事线、设计和计划边界
    document: docs/user-stories/project-maintainer/pm-001-document-boundary.md
    protected_paths:
      - .gitignore
      - .agentic-ops-source
      - .github/**
      - .python-version
      - .editorconfig
      - .pre-commit-config.yaml
      - LICENSE
      - SECURITY.md
      - CODEOWNERS
      - AGENTS.md
      - README.md
      - plans/**
      - docs/README.md
      - docs/strategy/**
      - docs/architecture/**
      - docs/runtime/**
      - docs/project-rules.md
      - docs/review-checklist.md
      - docs/decision-log.md
      - docs/development-style.md
      - docs/maintainers/getting-started.md
      - docs/processes/human-decision-handling-guide.md
      - docs/user-stories/**
      - shared/**
    acceptance_checks:
      - resource_contracts
      - story_registry
    evidence_requirements:
      - 故事、设计、Jira 计划和实现状态边界检查
      - 文档链接与格式检查

  - story_id: PM-002
    category: maintainer
    title: 维护操作契约、标准流程和工作流配置
    document: docs/user-stories/project-maintainer/pm-002-standard-assets.md
    protected_paths:
      - developer/standards/**
      - maintainer/standards/experiments/**
      - developer/runtime/src/ao_work/config/**
      - developer/runtime/src/ao_work/jira/**
      # AO-11 已删除的根目录标准资产仍保留一次性变更映射，确保 staged deletion 受故事门禁审计。
      - standards/**
      - install-resources/basic/contracts/**
      - install-resources/basic/projects/**
      # AO-11 迁移保留的标准说明逐项映射，避免以 docs/** 兜底。
      - docs/configuration-standards.md
      - docs/configuration/ao-agentic-defect-jira-configuration.md
      - docs/contracts/operation-contract.md
      - docs/forms/task-form-standard.md
      - docs/processes/standard-process-registry.md
      - docs/profiles/workflow-profile.md
    acceptance_checks:
      - python_runtime
      - resource_contracts
    evidence_requirements:
      - 操作契约、Profile 和标准资产校验结果
      - 缺失映射与未知状态的结构化失败证据

  - story_id: PM-003
    category: maintainer
    title: 构建和验证 developer 安装交付
    document: docs/user-stories/project-maintainer/pm-003-release-assets.md
    protected_paths:
      - .python-version
      - developer/pyproject.toml
      - developer/uv.lock
      - maintainer/pyproject.toml
      - maintainer/uv.lock
      - developer/bootstrap/**
      - developer/runtime/**
      - maintainer/scripts/test-python-runtime.sh
      - maintainer/scripts/test-resources.sh
      # AO-11 已删除的 Go、根 Python 试验结构和旧分发路径仍需要在本次 staged deletion 中映射到故事。
      - go.mod
      - go.sum
      - pyproject.toml
      - uv.lock
      - bootstrap/**
      - runtime/**
      - packages/**
      - scripts/**
      - tests/**
      - scripts/install.sh
      - scripts/update-checksums.sh
      - install-resources/**
    acceptance_checks:
      - python_runtime
      - resource_contracts
      - release_workflow
    evidence_requirements:
      - maintainer/developer Python 锁文件一致性结果
      - developer-only 安装、更新、回滚和旧 Go 分发残留检查结果

  - story_id: PM-004
    category: maintainer
    title: 诊断问题并选择修复载体
    document: docs/user-stories/project-maintainer/pm-004-problem-diagnosis.md
    protected_paths:
      - maintainer/runtime/src/ao_maint/diagnose/**
      - developer/runtime/src/ao_work/**
      - developer/standards/runbooks/**
      - docs/runtime/problem-resolution-and-update.md
      - docs/workflows/feedback-loop.md
    acceptance_checks:
      - python_runtime
    evidence_requirements:
      - 稳定失败码与修复载体分类结果
      - 脱敏诊断边界检查

  - story_id: PM-005
    category: maintainer
    title: 处理反馈并形成改进建议
    document: docs/user-stories/project-maintainer/pm-005-feedback-proposal.md
    protected_paths:
      - developer/runtime/src/ao_work/**
      - developer/standards/runbooks/**
      - docs/workflows/feedback-loop.md
      - docs/templates/evidence-templates.md
      - docs/examples/v0.3-ao-pilot-result.md
      - docs/examples/v0.4-ao-pilot-result.md
    acceptance_checks:
      - python_runtime
      - resource_contracts
    evidence_requirements:
      - 目标 feedback 命令 capability_gap 与现役 task-to-PR 复盘包人工交接边界检查
      - observation、proposal、accepted change、敏感信息与人工确认门禁检查

  - story_id: PM-006
    category: maintainer
    title: 治理 latest 更新、回滚和兼容性
    document: docs/user-stories/project-maintainer/pm-006-release-governance.md
    protected_paths:
      - developer/bootstrap/update.sh
      - developer/bootstrap/rollback.sh
      - developer/bootstrap/lib/**
      - maintainer/scripts/release.sh
      - maintainer/scripts/hotfix.sh
      - maintainer/scripts/lib/**
      - .githooks/**
    acceptance_checks:
      - resource_contracts
      - release_workflow
    evidence_requirements:
      - 更新、回滚和固定 HEAD 验证结果
      - 保护分支与人工合并门禁结果

  - story_id: PM-007
    category: maintainer
    title: 守护两类项目故事质量基线
    document: docs/user-stories/project-maintainer/pm-007-story-quality-gate.md
    protected_paths:
      - maintainer/**
      - .githooks/pre-commit
      # AO-11 已删除的根目录 Skill/Rule 仍保留一次性变更映射，防止迁移删除绕过故事确认。
      - skills/**
      - rules/**
    acceptance_checks:
      - python_runtime
      - resource_contracts
      - release_workflow
      - story_registry
    evidence_requirements:
      - 两类故事注册表完整性结果
      - 未确认影响、故事修订、验收失败和缺失映射阻断证据
      - 公司员工指导员确认与验收证据

  - story_id: DE-001
    category: developer
    title: 安装 AgenticOps
    document: docs/user-stories/development-engineer/de-001-install.md
    protected_paths:
      - developer/bootstrap/**
      - developer/AGENTS.md
      # AO-11 已删除的根 Bootstrap 和旧分发目录仍映射本次 staged deletion。
      - bootstrap/**
      - scripts/install.sh
      - install-resources/**
      - developer/standards/agent-guides.md
    acceptance_checks:
      - python_runtime
      - resource_contracts
    evidence_requirements:
      - 新工作空间安装和入口可用性结果
      - 不需要 Go 环境且无 maintainer 资产泄漏的安装结果

  - story_id: DE-002
    category: developer
    title: 初始化项目 AI 工作空间
    document: docs/user-stories/development-engineer/de-002-workspace-init.md
    protected_paths:
      - developer/runtime/src/ao_work/workspace.py
      - developer/runtime/src/ao_work/workspace_init/**
      - developer/tests/runtime/test_workspace*.py
      - developer/runtime/src/ao_work/config/**
      - developer/standards/projects/**
      - developer/standards/contracts/operations/workspace-init.yaml
      - developer/skills/initialize-project-workspace/**
      - install-resources/basic/projects/**
    acceptance_checks:
      - python_runtime
      - resource_contracts
    evidence_requirements:
      - 工作空间隔离、Profile 和模式校验结果
      - 重复初始化与半状态恢复结果

  - story_id: DE-003
    category: developer
    title: 初始化研发工程师能力
    document: docs/user-stories/development-engineer/de-003-agent-init.md
    protected_paths:
      - developer/**
      - docs/development-engineers/agent-init.md
      - developer/standards/agent-guides.md
      # AO-11 已删除的根 Skill/Rule/标准资产仍映射本次 staged deletion。
      - agent-guides.md
      - agent-init.md
      - skills/**
      - rules/**
      - standards/**
      - install-resources/basic/ai-assets/**
      - install-resources/basic/handbooks/**
      - docs/ai-working-rules.md
      - docs/development-engineers/getting-started.md
    acceptance_checks:
      - resource_contracts
      - story_registry
    evidence_requirements:
      - developer 工作面与能力加载结果
      - 新会话不依赖聊天上下文的初始化结果

  - story_id: DE-004
    category: developer
    title: 新任务接管
    document: docs/user-stories/development-engineer/de-004-takeover-task.md
    protected_paths:
      - developer/runtime/src/ao_work/task_start.py
      - developer/runtime/src/ao_work/task_gate.py
      - developer/tests/runtime/test_task_start.py
      - developer/tests/runtime/test_task_gate.py
      - developer/runtime/src/ao_work/authorization/**
      - developer/runtime/src/ao_work/jira/**
      - developer/runtime/src/ao_work/task_state/**
      - developer/standards/contracts/operations/task-intake-assess.yaml
      - developer/standards/contracts/operations/solution-gate.yaml
      - developer/standards/contracts/operations/jira-*.yaml
      - developer/standards/projects/**
      - developer/skills/jira-task-collaboration/**
    acceptance_checks:
      - python_runtime
      - resource_contracts
    evidence_requirements:
      - Jira 任务身份、完整准入摘要、摘要确认和 L1-L4 方案门禁结果
      - Comment、Description 和 Worklog 幂等回读结果

  - story_id: DE-005
    category: developer
    title: 恢复接管任务
    document: docs/user-stories/development-engineer/de-005-resume-takeover.md
    protected_paths:
      - developer/runtime/src/ao_work/task_state/**
      - developer/runtime/src/ao_work/jira/**
      - developer/standards/runbooks/**
    acceptance_checks:
      - python_runtime
    evidence_requirements:
      - 中断、未知写入和幂等恢复结果
      - 外部事实与本地状态冲突阻断结果

  - story_id: DE-006
    category: developer
    title: 任务完成审计与反馈分析
    document: docs/user-stories/development-engineer/de-006-task-audit-feedback.md
    protected_paths:
      - developer/runtime/src/ao_work/task_state/**
      - developer/runtime/src/ao_work/jira/**
      - developer/runtime/src/ao_work/task_run/**
      - developer/tests/runtime/test_task_run.py
      - developer/skills/run-task-to-pr-test/**
      - developer/standards/contracts/**
      - developer/standards/capabilities/operations.yaml
      - developer/standards/runbooks/**
      - shared/integration/**
      - docs/templates/evidence-templates.md
      - docs/workflows/feedback-loop.md
      - docs/examples/end-to-end-demo.md
    acceptance_checks:
      - python_runtime
      - resource_contracts
    evidence_requirements:
      - 完成审计、Worklog 和反馈改进证据
      - 任务事实源与本地审计边界检查
      - 真实 Jira、Git、GitHub、验证事实的 Runtime 受信采集与 PR 前停止证据
      - 人工干预、等待、失败、重试、质量问题和优化候选的完整复盘证据

  - story_id: DE-007
    category: developer
    title: 指定分支验证安装
    document: docs/user-stories/development-engineer/de-007-verification-install.md
    protected_paths:
      - developer/bootstrap/install-verify-branch.sh
      - developer/tests/bootstrap/test_install_verify_boundary.sh
      - developer/runtime/src/ao_work/installation/
      - developer/tests/runtime/test_installation.py
      - docs/architecture/verification-install-design.md
    acceptance_checks:
      - python_runtime
      - resource_contracts
    evidence_requirements:
      - 远程模式可运行验证安装与本地模式流程验证结果
      - 无标记非 main 阻断与 verification_branch_unreachable 门禁结果

  - story_id: DE-008
    category: developer
    title: PR CI 持续监控与失败自动修复
    document: docs/user-stories/development-engineer/de-008-pr-ci-remediation.md
    protected_paths:
      - developer/runtime/src/ao_work/task_run/**
      - developer/runtime/src/ao_work/config/**
      - developer/tests/runtime/test_ci_runtime.py
      - developer/tests/fixtures/ci/**
      - developer/skills/run-task-to-pr-test/**
      - developer/standards/contracts/operations/*ci*.yaml
      - developer/standards/contracts/processes/development-change-v2.yaml
      - developer/standards/capabilities/operations.yaml
      - developer/standards/stages/stages.yaml
      - shared/integration/task-to-pr-manifest.schema.json
      - shared/integration/task-to-pr-result.schema.json
      - maintainer/runtime/src/ao_maint/integration/task_to_pr.py
      - maintainer/tests/runtime/test_ci_completion_contract.py
    acceptance_checks:
      - python_runtime
      - resource_contracts
      - story_registry
    evidence_requirements:
      - 最终 PR Head/Base、GitHub Workflow 自动判定、必需检查严格 SUCCESS、固定截止时间和恢复状态证据
      - Artifact 安全、Failsafe 脱敏解析、三次修复预算和幂等测试
      - v1 兼容、v2 取消内置代码审查及禁止合并/Jira Done/发布的边界证据
