policy: default
workplane: developer
version: 1
gates:
  write_jira_comment:
    required: false
  write_local_evidence:
    required: false
  transition_jira_status:
    required: true
  git_commit:
    required: true
  git_push:
    required: true
  git_merge:
    required: true
  git_rebase:
    required: true
  git_clean:
    required: true
  create_pr:
    required: true
  update_pr:
    required: true
  fix_pr_comments:
    required: true
  scope_change:
    required: true
authorization_scopes:
  task_execution:
    confirmation_source: jira_decision
    required_bindings:
      - issue_key
      - agentic_run_id
      - agent_id
      - agentic_id
      - target_repo
      - work_branch
      - base_branch
      - approved_plan_version
      - approved_scope
      - verification_method
    covered_operations:
      - git_commit
      - git_push
      - write_jira_comment
      - create_pr
      - update_pr
    excluded_operations:
      - git_merge
      - release
      - git_tag
      - protected_branch_push
      - force_push
      - history_rewrite
      - scope_change
    invalidated_by:
      - ownership_changed
      - binding_mismatch
      - scope_changed
      - risk_increased
      - verification_blocked
      - repeated_failure
      - ambiguous_external_write
