operation: write_pr_evidence
workplane: developer
version: 1
purpose: 将拉取请求链接、CI 状态、审查结论和风险摘要写入任务证据链。
task_type: evidence_write
allowed_stages:
  - pr_plan_prepared
  - pr_created
  - ci_passed
  - review_approved
required_inputs:
  - workspace
  - agentic_run_id
  - pr_url
input:
  workspace:
    type: string
    required: true
  agentic_run_id:
    type: string
    required: true
  pr_url:
    type: string
    required: true
  authorization_reference:
    type: string
    required: false
preconditions:
  - run_must_exist
  - pr_url_must_be_known
  - policy_must_allow_evidence_write
  - real_jira_write_must_be_confirmed_or_covered_by_valid_task_execution_authorization
output:
  workspace:
    type: string
  agentic_run_id:
    type: string
  pr_url:
    type: string
  pr_number:
    type: string
  head_sha:
    type: string
  ci_status:
    type: string
  review_status:
    type: string
  review_count:
    type: integer
  check_count:
    type: integer
  failing_check_count:
    type: integer
  pending_check_count:
    type: integer
  evidence:
    type: string
  audit_target:
    type: string
  audit_submitted:
    type: boolean
  audit_reference:
    type: string
  authorization_reference:
    type: string
  current_stage:
    type: string
  next_step:
    type: string
failure:
  codes:
    - missing_agentic_run_id
    - missing_pr_url
    - run_not_found
    - workspace_mismatch
    - local_state_mismatch
    - operation_stage_not_allowed
    - invalid_pr_url
    - github_pr_read_failed
    - github_ci_read_failed
    - jira_adapter_config_failed
    - real_jira_confirmation_required
    - jira_comment_write_failed
    - write_failed
    - event_write_failed
    - policy_not_found
    - policy_gate_required
    - evidence_write_failed
side_effects:
  - may_write_jira_comment
  - may_write_local_event
  - may_write_pr_comment
human_gate:
  required: true
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: pr_created
redo_from_stage: pr_created
