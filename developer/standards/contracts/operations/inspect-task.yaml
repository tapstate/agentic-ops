operation: inspect_task
workplane: developer
version: 2
purpose: 只读检查本地任务状态与 Jira 任务的受控详情，供 AIAgent 按标准资产判断下一步。
task_type: task_inspection
allowed_stages:
  - waiting_takeover
  - takeover_gate
  - takeover_started
  - implementation
  - blocked
required_inputs:
  - issue_key
  - workspace
input:
  issue_key:
    type: string
    required: true
  workspace:
    type: string
    required: true
preconditions:
  - local_task_must_exist
  - jira_issue_and_comments_must_be_readable
  - current_user_must_match_assignee
  - local_task_identity_must_match_jira_issue
output:
  task:
    type: object
  task_facts:
    type: object
    required_fields:
      - description
      - comments
      - repository_branch_hints
    rules:
      - description_and_comment_bodies_must_be_redacted_and_structured
      - raw_description_and_comment_bodies_must_not_be_output_or_persisted
      - repository_branch_hints_are_proposal_only
failure:
  codes:
    - missing_issue_key
    - jira_adapter_config_failed
    - jira_issue_read_failed
    - issue_not_found
    - jira_current_user_failed
    - jira_task_description_unsupported
    - jira_task_comment_read_failed
    - jira_task_comment_unsupported
    - assignee_mismatch
    - task_identity_mismatch
    - jira_workspace_mismatch
side_effects:
  - read_jira_issue_description
  - read_jira_issue_comments
  - must_not_write_jira
  - must_not_write_local_task_state
  - must_not_modify_business_source
human_gate:
  required: false
retry_policy:
  retryable: false
  max_attempts: 0
  redo_from_stage: takeover_gate
redo_from_stage: takeover_gate
