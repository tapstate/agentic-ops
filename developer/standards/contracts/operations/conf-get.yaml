operation: conf_get
workplane: developer
version: 1
purpose: 读取 AgenticOps effective configuration 中的单个 key。
task_type: configuration_read
allowed_stages:
  - installed
  - workspace_initialized
  - implementation
required_inputs:
  - key
input:
  key:
    type: string
    required: true
    description: 配置 key，例如 paths.user_config、paths.user_env、jira.base_url、jira.api_token_configured。
  workspace:
    type: string
    required: false
    description: 项目配置项；读取项目分段配置时使用。
output:
  key:
    type: string
    required: true
  workspace:
    type: string
    required: false
  value:
    type: any
    required: false
  source:
    type: string
    required: false
  secret:
    type: boolean
    required: false
  agentic_next_action:
    type: string
    required: true
failure:
  codes:
    - missing_config_key
    - conf_key_not_found
    - conf_key_not_configured
    - conf_resolve_failed
    - conf_secret_redacted
side_effects:
  - must_not_write_config
  - must_not_reveal_secret_values
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: installed
redo_from_stage: installed
notes:
  - conf_get 是外部脚本和 AIAgent 读取配置的统一入口；不要让脚本直接解析 YAML 或 dotenv。
  - secret key 默认不输出原值；使用 *_configured 这类布尔 key 判断是否已配置。
