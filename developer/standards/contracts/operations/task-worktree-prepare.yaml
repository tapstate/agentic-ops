operation: task_worktree_prepare
version: 1
workplane: developer
inputs:
  issue_key:
    required: true
preconditions:
  - selected_repositories_must_be_in_confirmed_task_domain
  - confirmed_origin_branch_must_resolve_to_fixed_sha
side_effects:
  - create_or_reuse_confirmed_domain_git_worktrees
  - create_confirmed_task_branches
  - record_exact_multi_repository_source_context
postconditions:
  - source_pool_primary_worktree_is_unchanged
  - worktree_path_matches_jira_repository_branch_layout
  - source_context_binds_repository_scope_revision
