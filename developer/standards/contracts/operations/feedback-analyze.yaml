operation: feedback_analyze
workplane: developer
version: 1
purpose: 从反馈事件中分析重复失败模式、已确认恢复模式、人工门禁热点和缺失字段趋势。
task_type: feedback_analysis
allowed_stages:
  - evidence_written
  - blocked
  - completed
required_inputs:
  - workspace
input:
  workspace:
    type: string
    required: true
  date:
    type: string
    required: false
  agentic_run_id:
    type: string
    required: false
  issue_key:
    type: string
    required: false
  task_type:
    type: string
    required: false
  code:
    type: string
    required: false
  from:
    type: string
    required: false
  to:
    type: string
    required: false
preconditions:
  - workspace_must_be_initialized
  - feedback_events_must_be_readable
output:
  workspace:
    type: string
  scope:
    type: string
  runs:
    type: integer
  failure_patterns:
    type: object
  recovery_patterns:
    type: object
  human_gate_hotspots:
    type: object
  missing_field_trends:
    type: object
  suggested_assets:
    type: object
  analysis_report:
    type: string
  agentic_next_action:
    type: string
failure:
  codes:
    - workspace_root_failed
    - event_read_failed
    - invalid_filter
    - report_write_failed
side_effects:
  - may_write_workspace_feedback
  - must_not_write_jira
  - must_not_write_github
  - must_not_modify_agenticops_rules
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: evidence_written
redo_from_stage: evidence_written
