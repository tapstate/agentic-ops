operation: prepare_pr
workplane: developer
version: 1
purpose: 生成结构化拉取请求计划，停在推送和创建 PR 的人工确认点。
task_type: pr_preparation
allowed_stages:
  - takeover_started
  - takeover_resumed
  - development_completed
required_inputs:
  - workspace
  - agentic_run_id
input:
  workspace:
    type: string
    required: true
  agentic_run_id:
    type: string
    required: true
  source_root:
    type: string
    required: false
  base:
    type: string
    required: false
  title:
    type: string
    required: false
  body:
    type: string
    required: false
preconditions:
  - run_must_exist
  - git_workspace_must_be_inspectable
  - policy_must_define_git_and_github_gates
output:
  workspace:
    type: string
  agentic_run_id:
    type: string
  issue_key:
    type: string
  target_repo:
    type: string
  branch:
    type: string
  base:
    type: string
  title:
    type: string
  body:
    type: string
  changed_files:
    type: array
  policy_gates:
    type: object
  authorization_scope:
    type: string
  authorization_reference:
    type: string
  fixed_head_sha:
    type: string
  policy_gate_code:
    type: string
  blocked_operations:
    type: array
  current_stage:
    type: string
  agentic_next_action:
    type: string
failure:
  codes:
    - missing_agentic_run_id
    - run_not_found
    - workspace_mismatch
    - local_state_mismatch
    - source_root_not_found
    - git_inspect_failed
    - policy_not_found
    - event_write_failed
side_effects:
  - may_write_local_event
  - must_not_push_git
  - must_not_create_pr
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: takeover_started
redo_from_stage: takeover_started
