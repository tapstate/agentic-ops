operation: check_ci_status
workplane: developer
version: 3
purpose: 先依据 GitHub PR Base 的 Workflow 事实自动判定是否需要 CI；需要时严格核对 Project Profile 声明的必需检查，并维护固定截止时间与有限修复预算。
task_type: ci_check
allowed_stages:
  - ci_validation
required_inputs:
  - manifest
input:
  manifest:
    type: string
    required: true
preconditions:
  - process_id_must_be_development_change_v2
  - manifest_ci_must_equal_current_project_profile
  - github_ci_read_must_be_explicitly_authorized
output:
  ci_requirement:
    type: object
  ci_status:
    type: string
  head_sha:
    type: string
  required_checks:
    type: array
  missing_required_checks:
    type: array
  workflow_runs:
    type: array
  attempt_id:
    type: string
  start_deadline_at:
    type: [string, "null"]
  execution_started_at:
    type: [string, "null"]
  completion_deadline_at:
    type: [string, "null"]
  poll_interval_seconds:
    type: integer
  remediation_attempts_used:
    type: integer
  remediation_attempts_remaining:
    type: integer
  current_stage:
    type: string
  agentic_next_action:
    type: string
failure:
  codes:
    - ci_process_not_enabled
    - ci_profile_binding_mismatch
    - ci_pr_binding_mismatch
    - ci_requirement_observation_failed
    - ci_requirement_unknown
    - ci_requirement_changed
    - ci_required_check_missing
    - ci_required_check_duplicate
    - ci_status_unknown
    - ci_start_timeout
    - ci_completion_timeout
    - ci_retry_exhausted
side_effects:
  - must_not_write_github
  - must_not_modify_git
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: until_fixed_deadline
  redo_from_stage: ci_running
redo_from_stage: ci_running
