operation: task_intake_assess
version: 2
workplane: developer
actions:
  - assess
inputs:
  task_identity:
    - issue_key
    - agentic_run_id
  assess_file:
    source: workspace_relative_safe_json
    required_fields:
      - auto_filled_values
      - unresolved_information
      - assumptions
      - impacts
    array_fields:
      - auto_filled_values
      - unresolved_information
      - assumptions
      - impacts
source_priority:
  - jira_issue
  - jira_comment
  - project_profile
  - business_source_code
  - runtime_readback
gates:
  - task_must_already_be_taken_over
  - task_start_source_context_is_current
  - source_repository_head_is_valid_and_worktree_is_clean
  - trusted_source_values_match_exact_runtime_snapshot
  - business_source_evidence_file_digest_matches
  - required_profile_fields_are_resolved
  - task_facts_are_redacted_and_current
  - source_context_head_or_evidence_change_invalidates_analysis
next_action:
  complete: prepare_and_classify_solution
  missing_but_recoverable: resolve_missing_task_information_and_retry_once
  fact_conflict_or_retry_exhausted: risk_decision
human_gate:
  required: false
  note: 完整准入分析自动进入方案分析，不设置独立确认门禁。
retry:
  max_additional_attempts_per_unchanged_source_cycle: 1
  same_input_allowed: false
  requires_state_readback: true
  recorded_in_task_journal: true
input_contract_recovery:
  retry_safe: true
  executor: ai
  user_input_required: false
  rule: AI 重建合同输入后重试一次；不得把内部 JSON 结构错误升级为用户信息门禁。
side_effects:
  - write_local_task_gate_state
  - write_local_progress_and_journal
  - must_not_write_jira
  - must_not_modify_business_source
  - must_not_commit_or_push
failure:
  - task_source_context_missing
  - task_source_repository_invalid
  - task_source_not_clean
  - intake_verified_value_mismatch
  - intake_source_evidence_changed
  - task_intake_incomplete
  - task_intake_retry_exhausted
