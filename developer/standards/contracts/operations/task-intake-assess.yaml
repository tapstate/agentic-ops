operation: task_intake_assess
version: 1
workplane: developer
actions:
  - assess
  - confirm
inputs:
  task_identity:
    - issue_key
    - agentic_run_id
  assess_file:
    source: workspace_relative_safe_json
    required_fields:
      - auto_filled_values
      - unresolved_information
      - assumptions
      - impacts
  confirmation:
    required_fields:
      - confirm_intake_digest
      - confirmed_by
      - authorization_reference
source_priority:
  - jira_issue
  - project_profile
  - business_source_code
  - runtime_readback
gates:
  - task_start_source_context_is_current
  - source_repository_head_is_valid_and_worktree_is_clean
  - trusted_source_values_match_exact_runtime_snapshot
  - business_source_evidence_file_digest_matches
  - required_profile_fields_are_resolved
  - required_unresolved_information_blocks_confirmation
  - confirmation_binds_issue_run_and_intake_digest
  - source_context_head_or_evidence_change_invalidates_confirmation
retry:
  max_additional_attempts_per_unchanged_source_cycle: 1
  same_input_allowed: false
  requires_state_readback: true
  recorded_in_task_journal: true
side_effects:
  - write_local_task_gate_state
  - write_local_progress_and_journal
  - must_not_write_jira
  - must_not_modify_business_source
  - must_not_commit_or_push
failure:
  - task_source_context_missing
  - task_source_repository_invalid
  - task_source_not_clean
  - intake_verified_value_mismatch
  - intake_source_evidence_changed
  - task_intake_incomplete
  - task_intake_digest_mismatch
  - task_intake_confirmation_invalid
  - task_intake_retry_exhausted
