operation: list_tasks
workplane: developer
version: 1
purpose: 列出当前 owner 可处理任务。
task_type: task_listing
allowed_stages:
  - initialized
required_inputs:
  - workspace
input:
  workspace:
    type: string
    required: true
preconditions:
  - workspace_must_be_initialized
  - current_user_must_be_known
  - profile_task_query_must_be_valid
  - jira_runtime_config_must_resolve_real_adapter
output:
  workspace:
    type: string
  tasks:
    type: array
  agentic_next_action:
    type: string
failure:
  codes:
    - missing_workspace
    - workspace_not_initialized
    - current_user_unavailable
    - task_query_failed
    - jira_adapter_config_failed
    - jira_search_failed
  context:
    jira_adapter_config_failed:
      may_include:
        jira_token_env:
          type: string
        jira_env_file:
          type: string
        jira_token_env_has_value:
          type: boolean
        jira_token_help_url:
          type: string
        jira_token_setup:
          type: string
        jira_config_source:
          type: string
side_effects:
  - must_not_write_jira
  - must_not_modify_code
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: initialized
redo_from_stage: initialized
