operation: add_task_comment
workplane: developer
version: 1
purpose: 向 Jira 任务追加分类评论，保存分析、计划、决策、证据或阻塞轨迹。
task_type: jira_write
allowed_stages:
  - waiting_takeover
  - takeover_gate
  - implementation
  - pr_review
  - completed
required_inputs:
  - issue_key
  - workspace
  - category
  - content_file
input:
  issue_key:
    type: string
    required: true
  workspace:
    type: string
    required: true
  category:
    type: string
    required: true
    enum:
      - analysis
      - plan
      - decision
      - evidence
      - blocked
  content_file:
    type: string
    required: true
  agentic_run_id:
    type: string
    required: false
  authorization_reference:
    type: string
    required: false
preconditions:
  - current_user_must_match_owner_and_assignee
  - agentic_id_must_be_empty_or_match_agent_id
  - agentic_run_id_must_match_issue_when_provided
  - real_jira_write_must_be_confirmed_or_covered_by_valid_task_execution_authorization
output:
  workspace:
    type: string
  issue_key:
    type: string
  agentic_run_id:
    type: string
  authorization_reference:
    type: string
  category:
    type: string
  current_stage:
    type: string
  agentic_next_action:
    type: string
failure:
  codes:
    - missing_issue_key
    - missing_content_file
    - content_file_read_failed
    - empty_comment_content
    - invalid_comment_category
    - jira_adapter_config_failed
    - jira_issue_read_failed
    - issue_not_found
    - jira_current_user_failed
    - owner_mismatch
    - assignee_mismatch
    - agent_ownership_conflict
    - unknown_jira_status
    - operation_contract_not_found
    - operation_contract_load_failed
    - operation_stage_not_allowed
    - run_not_found
    - workspace_mismatch
    - local_state_mismatch
    - run_issue_mismatch
    - real_jira_confirmation_required
    - jira_comment_write_failed
    - event_write_failed
    - jira_write_completed_audit_failed
side_effects:
  - may_write_jira_comment
  - writes_local_audit_intent_before_jira
  - writes_local_audit_completion_after_jira
  - must_not_modify_description
  - must_not_modify_code
human_gate:
  required: true
retry_policy:
  retryable: false
  max_attempts: 0
  redo_from_stage: jira_write_gate
redo_from_stage: jira_write_gate
