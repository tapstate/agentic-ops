operation: parse_ci_report
workplane: developer
version: 2
purpose: 把 Maven Failsafe Artifact 与已采集的 Runner 失败日志组合为脱敏、结构化且摘要绑定的失败决策证据。
task_type: ci_check
allowed_stages: [ci_validation]
required_inputs: [manifest]
preconditions:
  - artifact_must_be_runtime_verified
  - extracted_artifact_must_still_match_recorded_file_digests
  - runner_log_fact_must_be_collected_before_decision
output:
  failure_event_id: {type: string}
  failed_tests: {type: array}
  report_sha256: {type: string}
  runner_log: {type: object}
  requires_failure_classification: {type: boolean}
  parsed: {type: boolean}
  next_step: {type: string}
failure:
  codes: [ci_artifact_not_ready, ci_runner_log_not_ready, ci_artifact_unsafe, ci_artifact_digest_mismatch, ci_artifact_state_conflict, ci_report_unsupported, ci_report_parse_failed]
side_effects:
  - write_only_normalized_report_and_summary
  - must_not_modify_business_source
human_gate:
  required: false
retry_policy:
  retryable: false
  max_attempts: 0
  redo_from_stage: ci_validation
