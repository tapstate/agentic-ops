operation: feedback_bundle
workplane: developer
version: 3
purpose: 为指定 `agentic_run_id` 生成符合 ao_problem_feedback/v1 的完整脱敏修复输入，供 maintainer 定位、复现、修复和回归 developer 问题；它不能替代任务级审计提交。
task_type: diagnosis
allowed_stages:
  - failed
  - blocked
  - completed
  - diagnosis
required_inputs:
  - workspace
  - agentic_run_id
optional_inputs:
  - redact
input:
  workspace:
    type: string
    required: true
  agentic_run_id:
    type: string
    required: true
  redact:
    type: boolean
    required: false
preconditions:
  - workspace_feedback_log_must_exist
  - secrets_must_always_be_redacted
output:
  workspace:
    type: string
  agentic_run_id:
    type: string
  bundle:
    type: string
  redacted:
    type: boolean
  report_schema:
    type: string
    const: ao_problem_feedback/v1
  repair_readiness:
    type: string
    enum: [ready, needs_information]
  information_groups:
    type: object
    required:
      - source_binding
      - source_conversation
      - chronological_session_log
      - version_and_environment
      - problem_context
      - actual_behavior
      - expected_behavior
      - minimal_reproduction
      - impact_scope
      - external_facts
      - evidence_inventory
      - human_intervention
      - initial_assessment
      - minimal_regression
      - acceptance_criteria
      - missing_facts
      - redaction_declaration
    item_state: [provided, not_applicable, unavailable]
    unavailable_requires: [reason, fact_source, minimal_action, blocks_repair]
  ordering:
    facts_before_summary: true
    source_conversation_before_initial_assessment: true
    chronological_session_log_before_initial_assessment: true
  session_log:
    requires_conversation_identifier: true
    exact_export_preferred: true
    reconstructed_log_must_be_labeled: verifiable_reconstruction
    summary_must_not_replace_log: true
  next_step:
    type: string
failure:
  codes:
    - missing_agentic_run_id
    - workspace_root_failed
    - event_read_failed
    - bundle_write_failed
    - sensitive_content_detected
    - repair_information_incomplete
side_effects:
  - may_write_local_diagnostic_bundle
  - must_not_write_jira
  - must_not_replace_task_audit_submission
  - must_not_modify_code
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: diagnosis
redo_from_stage: diagnosis
