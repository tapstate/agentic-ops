operation: fetch_ci_runner_log
workplane: developer
version: 1
purpose: 只读采集当前 CI Attempt 的 Runner Action 失败日志，输出长度受限且脱敏的诊断片段；不能读取时也保留真实原因。
task_type: ci_check
allowed_stages: [ci_validation, ci_decision]
required_inputs: [manifest]
preconditions:
  - github_ci_read_must_be_explicitly_authorized
  - current_attempt_must_be_failed_or_timed_out
output:
  available: {type: boolean}
  reason: {type: string}
  workflow_run_id: {type: [integer, "null"]}
  size_bytes: {type: integer}
  sha256: {type: [string, "null"]}
  excerpt: {type: string}
  truncated: {type: boolean}
  downloaded: {type: boolean}
  agentic_next_action: {type: string}
failure:
  codes: [ci_runner_log_not_ready, command_output_too_large]
side_effects:
  - write_only_redacted_runner_log_fact_to_current_task_run_ci_state
  - must_not_modify_business_source
  - must_not_rerun_workflow
human_gate:
  required: false
retry_policy:
  retryable: false
  max_attempts: 0
  redo_from_stage: ci_validation
