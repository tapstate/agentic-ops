operation: read_task_facts
workplane: developer
version: 1
purpose: 在已接管任务的接管后分析或独立只读核验中，从 Jira Description 和评论提取最小、脱敏、结构化的执行事实。
task_type: jira_read
allowed_stages:
  - takeover_started
  - implementation
  - blocked
required_inputs:
  - workspace
  - issue_key
preconditions:
  - issue_must_belong_to_workspace_project
  - current_user_must_match_assignee
  - local_task_identity_must_match_jira_issue
  - jira_description_and_comments_must_be_readable
output:
  issue_key:
    type: string
  agentic_run_id:
    type: string
  task_facts:
    type: object
    required_fields:
      - schema_version
      - redaction_applied
      - description
      - comments
      - repository_branch_hints
    rules:
      - task_goal_must_be_extracted_from_description_when_available
      - comments_are_supplementary_clues_not_field_replacements
      - repository_branch_hints_are_proposal_only
      - raw_description_and_comment_bodies_must_not_be_output_or_persisted
side_effects:
  - read_jira_issue_description
  - read_jira_issue_comments
  - must_not_write_jira
  - must_not_write_local_task_state
  - must_not_modify_business_source
failure:
  codes:
    - jira_task_description_unsupported
    - jira_task_comment_read_failed
    - jira_task_comment_unsupported
    - assignee_mismatch
    - task_identity_mismatch
    - jira_workspace_mismatch
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: jira_read
