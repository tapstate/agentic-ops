operation: task_worktree_cleanup
version: 1
workplane: developer
inputs:
  issue_key:
    required: true
preconditions:
  - jira_status_must_map_to_completed
  - repository_summary_comment_must_be_read_back
  - all_registered_worktrees_must_be_clean
  - every_final_head_must_be_carried_by_a_remote_branch
side_effects:
  - remove_only_exact_registered_worktrees_without_force
  - preserve_source_pool_primary_worktrees
failure_atomicity:
  - all_worktrees_preflight_before_first_remove
  - partial_cleanup_is_recorded_and_remaining_worktrees_are_preserved
