operation: jira_create
version: 1
workplane: developer
protocol:
  - plan
  - apply
  - readback
preconditions:
  - project_key_and_issuetype_validated_by_createmeta
  - required_fields_are_declared_by_createmeta_and_supplied
  - summary_is_chinese
  - outbound_content_is_safe_regular_file_and_contains_no_detected_credentials
  - plan_file_is_new_and_strictly_bound_to_project_run_jira_plans_directory
  - authorization_reference_strictly_binds_project_run_and_plan
  - idempotency_marker_absent_before_create
authorization:
  user_confirmation: "user-confirmation:<PROJECT-KEY>:<agentic-run-id>:<plan-id>"
  validation_order:
    - validate_create_plan
    - validate_authorization_reference
    - begin_create_attempt
    - write_jira
side_effects:
  - create_jira_issue
idempotency:
  marker: "[agentic-ops-idempotency:create:<project-key>:<agentic-run-id>:<key>]"
  marker_match: exact_top_level_paragraph_in_description
  readback: jql_search_project_by_marker_then_local_exact_match
readback_binding:
  required: [issue_key, agentic_run_id, plan_file, plan_id, idempotency_key, created]
  created_semantics: attempt_file_proves_this_run_created_the_issue
transport:
  redirects: forbidden
unknown_result:
  retry_safe: false
  next_action: readback
failure:
  - jira_create_required_fields_missing
  - jira_create_unknown_field
  - jira_create_meta_changed
  - jira_create_duplicate
  - jira_create_readback_mismatch
  - jira_authorization_reference_invalid
