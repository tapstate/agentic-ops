operation: fix_pr_comments
workplane: developer
version: 1
purpose: 读取并分类 PR 审查意见，输出修复计划；进入代码修改前必须人工确认。
task_type: pr_comment_fix
allowed_stages:
  - changes_requested
  - review_requested
required_inputs:
  - workspace
  - repo
  - pr
input:
  workspace:
    type: string
    required: true
  repo:
    type: string
    required: true
  pr:
    type: string
    required: true
preconditions:
  - github_cli_must_be_available
  - github_auth_must_be_valid
  - pr_comments_must_be_readable
  - policy_must_define_git_and_github_gates
output:
  workspace:
    type: string
  repo:
    type: string
  pr:
    type: string
  comments_count:
    type: integer
  fix_plan:
    type: array
  policy_gates:
    type: object
  blocked_operations:
    type: array
  current_stage:
    type: string
  agentic_next_action:
    type: string
failure:
  codes:
    - missing_pr_reference
    - github_pr_read_failed
    - policy_not_found
    - policy_gate_required
side_effects:
  - must_not_modify_git
  - must_not_push_git
  - must_not_write_github
human_gate:
  required: true
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: changes_requested
redo_from_stage: changes_requested
