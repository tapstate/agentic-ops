operation: takeover_task
workplane: developer
version: 7
purpose: 研发工程师明确要求接管任务后，由 Runtime 自动完成新接管、接纳存量或恢复留痕。
task_type: task_takeover
allowed_stages:
  - waiting_takeover
  - takeover_started
  - blocked
required_inputs:
  - workspace
input:
  issue_key:
    type: string
    required: false
    note: 缺省时只读列出候选，不执行接管。
  workspace:
    type: string
    required: true
preconditions:
  - issue_must_be_in_allowed_project
  - current_user_must_match_assignee
  - jira_status_and_transition_must_be_strictly_mapped
  - workspace_agent_identity_must_be_available
  - local_run_and_managed_comment_must_not_conflict
  - source_root_must_be_configured_pool_or_exact_independent_checkout
  - target_repository_must_resolve_to_profile_domain_in_pool_mode
  - all_domain_pool_members_and_remote_branches_must_validate_before_worktree_creation
selection_output:
  takeover_status:
    const: selection_required
  selection_required:
    const: true
  candidates:
    type: array
  human_notice:
    type: string
    note: 必须明确当前只列出候选且尚未执行接管。
  side_effects:
    - must_not_write_jira
    - must_not_transition_jira
    - must_not_create_takeover_record
output:
  workspace:
    type: string
  issue_key:
    type: string
  agentic_run_id:
    type: string
  agent_id:
    type: string
  agentic_takeover_at:
    type: string
  takeover_status:
    type: string
    enum:
      - in_progress
      - uncertain
      - blocked
      - completed
  takeover_kind:
    type: string
    enum:
      - new_takeover
      - accept_existing_task
      - resume_takeover
  human_notice:
    type: string
    non_new_must_include: 不是新接管
  takeover_comment_id:
    type: string
  takeover_comment_verified:
    type: boolean
  takeover_phase:
    type: string
    enum:
      - intent_persisted
      - comment_verified
      - status_verified
      - local_finalized
  takeover_result:
    type: string
    enum:
      - in_progress
      - uncertain
      - blocked
      - completed
  external_result_certainty:
    type: string
    enum:
      - not_attempted
      - verified
      - absent
      - uncertain
      - conflict
  retry_safe:
    type: boolean
  recovery_action:
    type: string
  intake_source:
    type: object
    required_fields:
      - context_digest
      - source_context_path
    note: 池模式只把目标仓库任务工作树绑定为 source_root；领域内其它工作树不作为顶层逐仓证据输出。
  jira_status_before:
    type: string
  jira_status_after:
    type: string
  transition_applied:
    type: boolean
  current_stage:
    type: string
    enum:
      - takeover_started
  agentic_next_action:
    type: object
    required_fields:
      - executor
      - action
      - required_inputs
      - allowed_operations
      - requires_authorization
      - stop_workflow
      - ownership_effect
      - retry_gate
source_preparation_postconditions:
  - pool_mode_source_root_must_equal_target_repository_worktree
  - target_worktree_must_match_ref_resolved_after_remote_refresh
  - per_worktree_git_identity_must_match_install_identity
  - legacy_task_worktree_layout_must_fail_closed_without_migration
  - current_output_does_not_claim_per_repository_alignment_evidence
post_takeover_analysis:
  required_before_implementation:
    - task_class
    - process_id
    - target_repo
    - target_branch
    - verification_method
  missing_behavior: 自动从 Jira、Project Profile、源码和 Runtime 回读补全；事实冲突或必须由人取舍时进入风险决策。
failure:
  codes:
    - assignee_unassigned
    - owner_mismatch
    - assignee_changed
    - agent_identity_missing
    - agent_ownership_conflict
    - external_task_state_conflict
    - jira_status_mapping_missing
    - standard_process_mapping_gap
    - jira_transition_mapping_gap
    - jira_adapter_config_failed
    - jira_issue_read_failed
    - jira_current_user_failed
    - jira_takeover_comment_write_failed
    - jira_takeover_comment_readback_mismatch
    - jira_takeover_readback_failed
    - jira_takeover_readback_mismatch
    - event_write_failed
    - takeover_schema_invalid
    - takeover_intent_missing
    - takeover_intent_conflict
    - takeover_phase_transition_invalid
    - takeover_comment_evidence_conflict
    - takeover_status_evidence_conflict
    - takeover_local_state_incomplete
    - takeover_legacy_state_unverified
    - takeover_state_identity_mismatch
    - missing_permission
    - workflow_transition_not_allowed
    - task_source_root_missing
    - task_source_repository_mismatch
    - target_repository_unknown
    - task_domain_unresolved
    - target_repository_not_mounted
    - task_baseline_unresolved
    - task_target_branch_invalid
    - task_target_branch_validation_failed
    - branch_derivation_failed
    - branch_alignment_tool_missing
    - branch_alignment_failed
    - source_pool_fetch_failed
    - worktree_legacy_layout_detected
    - worktree_invalid
    - worktree_baseline_mismatch
    - worktree_add_failed
    - worktree_path_invalid
    - task_lock_path_invalid
    - task_lock_timeout
side_effects:
  - may_write_jira_comment
  - may_transition_jira_status
  - may_create_or_reuse_takeover_record
  - may_write_local_event
  - may_write_local_source_context
  - may_fetch_existing_domain_pool_members
  - may_create_or_reuse_task_worktrees
  - may_write_per_worktree_git_identity
  - may_attempt_best_effort_removal_of_worktrees_created_by_failed_attempt
  - must_not_clone_missing_pool_member_during_takeover
  - must_not_modify_code
  - must_not_create_pr
human_gate:
  required: false
  authorization_basis: 用户明确表达“接管 <KEY>”即授权事实明确的常规接管；任务选择、事实冲突和不确定结果单独进入风险决策。
internal_authorization:
  source: runtime_bound_takeover_instruction
  user_visible: false
  binding: issue_key + agentic_run_id
  rule: Runtime 在 run 确定后生成稳定内部引用；没有外部参数、兼容模式或用户确认入口。
retry_policy:
  retryable: false
  max_attempts: 0
  redo_from_stage: waiting_takeover
redo_from_stage: waiting_takeover
local_state_machine:
  authority: sync.json.takeover_operation
  schema_version: 2
  phases:
    - intent_persisted
    - comment_verified
    - status_verified
    - local_finalized
  business_stage_rule: 仅当 phase=local_finalized 且 result=completed 时，progress.stage 才能对外呈现 takeover_started。
  legacy_migration: 只有受管 Comment 作者/标记、运行编号、负责人和 Status 全部回读一致时才允许从 schema v1 合成检查点。
