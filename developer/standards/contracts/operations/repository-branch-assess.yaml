operation: repository_branch_assess
version: 1
workplane: developer
inputs:
  issue_key:
    required: true
  task_domain:
    required: false
    allowed: [product, assistant, taptest]
preconditions:
  - task_must_already_be_taken_over
  - source_pool_members_must_refresh_and_resolve_remote_refs
side_effects:
  - write_local_repository_proposal
  - must_not_create_worktrees
  - must_not_modify_business_source
output:
  - task_domain
  - repository_scope_revision
  - proposed_repository_branch_map
  - problem_version_repository
  - fixed_analysis_sha_per_repository
next_action: review_and_confirm_task_domain
