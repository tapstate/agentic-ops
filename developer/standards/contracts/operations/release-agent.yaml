operation: release_agent
workplane: developer
version: 1
purpose: 完成或明确交接后结束当前本地运行，通过 Jira 中文结果评论和任务审计记录形成可追溯终点。
task_type: task_takeover
allowed_stages:
  - completed
  - handed_off
  - completion_cleanup
required_inputs:
  - workspace
  - agentic_run_id
  - issue_key
  - agentic_completion_evidence
input:
  workspace:
    type: string
    required: true
  agentic_run_id:
    type: string
    required: true
  issue_key:
    type: string
    required: true
  agentic_completion_evidence:
    type: string
    required: true
  jira_transition_id:
    type: string
    required: false
preconditions:
  - run_must_exist
  - current_user_must_match_owner
  - agentic_completion_evidence_must_exist
  - task_audit_evidence_must_be_submitted_or_referenced
output:
  workspace:
    type: string
  issue_key:
    type: string
  agentic_run_id:
    type: string
  agent_id:
    type: string
  terminal_comment_id:
    type: string
  terminal_comment_verified:
    type: boolean
  completed_at:
    type: string
  agentic_completion_evidence:
    type: string
  audit_target:
    type: string
  audit_submitted:
    type: boolean
  audit_reference:
    type: string
  jira_transition_id:
    type: string
  current_stage:
    type: string
  next_step:
    type: string
failure:
  codes:
    - missing_agentic_run_id
    - missing_issue_key
    - missing_agentic_completion_evidence
    - run_not_found
    - assignee_changed
    - agentic_completion_evidence_missing
    - jira_adapter_config_failed
    - jira_issue_read_failed
    - jira_current_user_failed
    - real_jira_confirmation_required
    - missing_jira_write_mapping
    - terminal_comment_write_failed
    - terminal_comment_readback_mismatch
    - jira_transition_mapping_gap
    - jira_transition_failed
    - event_write_failed
side_effects:
  - may_write_jira_comment
  - may_transition_jira_issue
  - may_write_local_event
  - may_confirm_task_audit_submission
  - must_not_modify_code
  - must_not_create_pr
human_gate:
  required: true
  reason: 结束运行代表完成或交接结束，必须由研发工程师确认完成证据和终止评论。
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: completion_cleanup
redo_from_stage: completion_cleanup
