operation: policy_validate
workplane: developer
version: 1
purpose: 校验当前工作空间使用的策略是否包含关键步骤门禁配置。
task_type: policy_validation
allowed_stages:
  - design_review
  - implementation
  - policy_update_required
required_inputs:
  - workspace
input:
  workspace:
    type: string
    required: true
preconditions:
  - repo_root_must_exist
  - policy_file_must_exist
output:
  workspace:
    type: string
  policy:
    type: string
  issues:
    type: integer
  next_step:
    type: string
failure:
  codes:
    - missing_workspace
    - repo_root_not_found
    - policy_not_found
    - policy_validation_failed
    - missing_policy_name
    - missing_policy_version
    - missing_gates
    - missing_required_gate
side_effects:
  - must_not_write_jira
  - must_not_modify_policy
  - must_not_modify_code
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: design_review
redo_from_stage: design_review
