operation: solution_gate
version: 4
workplane: developer
actions:
  - classify
inputs:
  required:
    - intake_digest
    - proposed_solution
    - scope
    - risk_flags
    - classification_evidence
    - residual_risks
  optional:
    - execution_plan
execution_plan:
  required_for_task_run_prepare: true
  fields:
    - exactly_one_of_change_repository_or_change_repositories
    - verification
    - review_summary
  multi_repository:
    scope_reference: owner/repository::relative/path
    verification_repository_binding: required
    every_repository_has_included_scope_and_verification: required
  normalization:
    maven: add_batch_and_offline_before_validation
  human_gate:
    internal_digest_or_path_confirmation: forbidden
levels:
  L1:
    condition: no_fixed_risk_flag_enabled
    action: prepare_combined_design_and_execution_authorization
  L2:
    flags:
      - user_choice_required
      - external_side_effect
      - nontrivial_risk
    action: risk_decision
  L3:
    flags:
      - architecture_change
      - public_contract_change
      - security_boundary_change
      - data_migration
      - confirmed_design_change
    action: revise_design_then_reassess
  L4:
    flags:
      - fact_conflict
      - permission_gap
      - capability_gap
    action: stop_and_escalate
gates:
  - current_intake_digest_is_current
  - source_context_and_head_are_unchanged
  - every_enabled_flag_has_classification_evidence
  - included_and_excluded_scope_do_not_overlap
  - source_or_solution_change_invalidates_previous_design_review
human_gate:
  design_review: required
  risk_decision: required
  intake_confirmation: forbidden
  generic_solution_digest_confirmation: forbidden
side_effects:
  - write_local_task_gate_state
  - write_local_progress_and_journal
  - must_not_write_jira
  - must_not_modify_business_source
  - must_not_commit_or_push
failure:
  - task_intake_not_assessed
  - task_intake_source_changed
  - solution_intake_digest_mismatch
  - solution_classification_evidence_missing
  - solution_scope_conflict
  - solution_gate_stale
