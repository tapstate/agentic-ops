operation: jira_transition
workplane: developer
version: 1
purpose: AIAgent 在处理任务过程中，通过受控、可审计的方式把 Jira 任务卡片流转到项目工作流中的既有状态（plan/apply/readback 协议）。
task_type: jira_status_transition
allowed_stages:
  - implementation
  - waiting_takeover
required_inputs:
  - issue_key
  - workspace
input:
  issue_key:
    type: string
    required: true
  workspace:
    type: string
    required: true
  target_transition:
    type: string
    required: false
    note: profile transitions 映射 key，与 target_status 二选一
  target_status:
    type: string
    required: false
    note: 目标 Jira 状态名（须在 profile statuses 映射内），与 target_transition 二选一
  comment:
    type: string
    required: false
    note: 可选中文状态流转说明评论
preconditions:
  - current_user_must_match_owner
  - target_must_be_profile_mapping_intersect_jira_available
  - completed_stage_forbidden_by_default
  - plan_must_bind_task_issue_and_agentic_run_id
  - authorization_reference_required_for_apply
output:
  issue_key:
    type: string
  plan_id:
    type: string
  action:
    type: string
    enum:
      - create_or_update
      - no_op
  from_status:
    type: string
  target_status:
    type: string
  transition_id:
    type: string
  transition_name:
    type: string
  current_status:
    type: string
  status_matched:
    type: boolean
  external_id:
    type: string
    note: transition 无稳定外部 ID，external_id 记录本次使用的 transition id
failure:
  codes:
    - invalid_transition_target
    - jira_transition_mapping_gap
    - jira_transition_completed_forbidden
    - jira_transition_failed
    - jira_transition_readback_mismatch
    - jira_issue_read_failed
    - jira_assignee_mismatch
    - real_jira_confirmation_required
    - missing_jira_write_mapping
    - jira_write_plan_mismatch
    - jira_write_plan_invalid
    - jira_write_plan_tampered
    - jira_credential_exposure_forbidden
    - workflow_transition_not_allowed
    - missing_permission
  context:
    jira_transition_mapping_gap:
      may_include:
        issue_key:
          type: string
        project_key:
          type: string
        current_status:
          type: string
        available_transitions:
          type: array
        configured_transitions:
          type: object
        configured_statuses:
          type: object
        guidance:
          type: string
    jira_transition_completed_forbidden:
      may_include:
        issue_key:
          type: string
        target_status:
          type: string
        completed_stage:
          type: string
    jira_transition_readback_mismatch:
      may_include:
        issue_key:
          type: string
        current_status:
          type: string
        target_status:
          type: string
side_effects:
  - may_transition_jira_status
  - may_write_local_event
  - must_not_modify_code
  - must_not_create_pr
human_gate:
  required: true
  note: apply 必须提供 user-confirmation 授权引用（绑定 agentic_run_id 与 plan_id）
retry_policy:
  retryable: false
  max_attempts: 0
  redo_from_stage: jira_transition_plan
redo_from_stage: jira_transition_plan
