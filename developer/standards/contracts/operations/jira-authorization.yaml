operation: jira_authorization
version: 3
workplane: developer
actions:
  - configure
  - show
account:
  cardinality: one_per_developer_install
  shared_install_has_identity: true
  cross_workspace_credential_inheritance: same_install_only
  precedence:
    - installation
  writable:
    - installation
storage:
  identity: user/identity.yaml
  credentials: user/.env
  workspace_reference: install_identity_ref
security:
  - token_must_not_be_accepted_as_command_argument
  - token_must_not_be_returned_or_logged
  - credential_file_mode_must_be_0600
  - writes_must_be_locked_and_atomic
  - email_and_token_must_share_one_source
  - process_environment_must_not_be_read_implicitly
  - workspace_must_not_store_or_read_credentials
  - workspace_init_must_verify_jira_identity_and_project_access
  - schema_v3_workspace_must_fail_closed_before_credential_read
failure:
  - install_identity_missing
  - install_identity_incomplete
  - install_identity_invalid
  - authorization_email_invalid
  - authorization_token_empty
  - authorization_token_invalid
  - jira_credentials_missing
  - install_user_dir_invalid
  - install_identity_write_failed
