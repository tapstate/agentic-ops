operation: inspect_workspace
workplane: developer
version: 2
purpose: 读取业务源码仓库的 Git 安全摘要，不修改工作区。
task_type: workspace_inspection
allowed_stages:
  - takeover_started
  - takeover_resumed
  - development_completed
  - blocked
required_inputs:
  - workspace
input:
  workspace:
    type: string
    required: true
  source_root:
    type: string
    required: false
preconditions:
  - git_must_be_available
  - workspace_state_directory_must_not_be_symlink
  - source_root_must_be_git_repository
  - source_root_must_not_be_agenticops_source_or_descendant
output:
  workspace:
    type: string
  source_root:
    type: string
  branch:
    type: string
  commit:
    type: string
  dirty:
    type: boolean
  changed_files:
    type: array
  current_stage:
    type: string
  next_step:
    type: string
failure:
  codes:
    - source_root_not_found
    - workspace_state_symlink_forbidden
    - workplane_mismatch
    - git_inspect_failed
side_effects:
  - must_not_modify_git
  - must_not_write_github
  - must_not_write_jira
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: takeover_started
redo_from_stage: takeover_started
