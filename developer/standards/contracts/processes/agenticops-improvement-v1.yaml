process_id: agenticops_improvement_v1
workplane: developer
task_classes:
  - process_improvement
entry_stage: waiting_takeover
stages:
  - id: waiting_takeover
    responsible_role: development_engineer
    input_fields:
      - assignee
      - task_class
      - target_repo
      - verification_method
    output_fields:
      - agentic_run_id
      - takeover_kind
      - takeover_comment_id
      - agentic_takeover_at
      - current_stage
      - agentic_next_action
    review_gate: null
  - id: implementation
    responsible_role: ai_agent
    output_fields:
      - improvement_summary
      - changed_assets
      - verification_result
      - residual_risk
      - execution_authorization
      - authorization_reference
    review_gate: development_engineer_review
  - id: pr_review
    responsible_role: development_engineer
    input_fields:
      - execution_authorization
      - authorization_reference
      - improvement_summary
      - changed_assets
      - verification_result
      - residual_risk
      - pr_url
      - fixed_head_sha
    output_fields:
      - review_decision
      - agentic_next_action
    review_gate: development_engineer_review
  - id: completed
    responsible_role: development_engineer
    completion_cleanup:
      write_terminal_comment: true
      close_local_run: true
