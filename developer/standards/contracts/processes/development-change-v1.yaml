process_id: development_change_v1
workplane: developer
stage_registry: developer/standards/stages/stages.yaml
task_classes:
  - feature_change
  - bug_fix
  - technical_task
entry_stage: waiting_takeover
ownership:
  source: business_workspace_agent_identity
  continuity: same_owner_until_code_review
  step_executor_does_not_change_owner: true
  transfer:
    status: capability_gap
    decision_authority: human_only
    current_action: stop_and_request_human_decision
stages:
  - id: waiting_takeover
    responsible_role: development_engineer
    runtime_operations:
      - takeover_task
    input_fields:
      - assignee
      - jira_status
      - workspace_agent_identity
      - explicit_takeover_instruction
    output_fields:
      - agentic_run_id
      - takeover_kind
      - takeover_status
      - human_notice
      - takeover_comment_id
      - agentic_takeover_at
      - current_stage
      - agentic_next_action
    review_gate: null
  - id: task_intake
    responsible_role: ai_agent
    runtime_operations:
      - task_intake_assess
    required_sequence:
      - analyze_known_and_missing_information
      - auto_fill_only_from_verified_sources
      - route_conflicts_to_risk_decision
    output_fields:
      - intake_facts
      - auto_filled_values_with_sources
      - unresolved_information
      - assumptions
      - impacts
      - intake_digest
    review_gate: null
  - id: solution_classification
    responsible_role: ai_agent
    runtime_operations:
      - solution_gate
    required_before_solution:
      - intake_digest
    output_fields:
      - proposed_solution
      - solution_level
      - classification_evidence
      - agentic_next_action
      - solution_digest
    review_gate: null
    routing:
      L1: design_review
      L2: risk_decision
      L3: revise_design_and_reassess
      L4: stop_and_escalate
  - id: design_review
    responsible_role: development_engineer
    input_fields:
      - proposed_solution
      - scope
      - verification_method
      - residual_risks
    output_fields:
      - design_review_decision
      - execution_authorization
      - authorization_reference
    review_gate: development_engineer_design_review
  - id: implementation
    responsible_role: ai_agent
    required_before_code_change:
      - task_taken_over
      - design_review_approved
    output_fields:
      - implementation_summary
      - verification_result
      - residual_risk
    review_gate: null
  - id: pr_review
    responsible_role: development_engineer
    input_fields:
      - execution_authorization
      - implementation_summary
      - verification_result
      - residual_risk
      - code_review_reference
    output_fields:
      - review_decision
      - agentic_next_action
    review_gate: development_engineer_code_review
  - id: completed
    responsible_role: development_engineer
    required_writeback:
      - implementation_summary
      - verification_result
      - residual_risk
      - agentic_completion_evidence
    completion_cleanup:
      write_terminal_comment: true
      close_local_run: true
