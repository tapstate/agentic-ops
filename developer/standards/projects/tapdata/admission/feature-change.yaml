task_class: feature_change
workplane: developer
template: templates/admission/feature-change-missing.md
required_fields:
  - acceptance_criteria
  - target_repo
  - verification_method
  - risk_level
guidance:
  acceptance_criteria:
    label: 验收标准
    location: Jira 描述 `验收标准` 章节或项目字段
    example: 关键用户场景完成验证，新增或变更行为有自动化测试覆盖。
    description: 说明需求完成后怎样判断可以验收。
  target_repo:
    label: 目标仓库
    location: Jira 组件、标签、项目仓库映射或项目字段
    example: tapdata/tapdata
    description: 说明本次任务应修改或检查的代码仓库。
  verification_method:
    label: 验证方式
    location: Jira 验证方式字段或项目字段
    example: 执行对应模块单元测试和必要的手工验证。
    description: 说明 AIAgent 完成后必须执行的验证命令或人工验证方式。
  risk_level:
    label: 风险等级
    location: Jira 风险字段或风险标签
    example: T3
    description: 说明任务风险级别，便于决定人工门禁和验证强度。
