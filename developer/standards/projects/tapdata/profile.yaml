schema_version: 1
profile_id: tapdata
connection_id: tapdata-cloud

jira:
  project_key: TAP
  issue_types:
    - Story
    - 故事
    - Bug
    - 缺陷
    - Task
    - 任务
  task_query: project = TAP AND assignee = currentUser() AND statusCategory != Done ORDER BY updated DESC

repositories:
  default: tapdata/tapdata
  list:
    - tapdata/tapdata
    - tapdata/tapdata-enterprise
    - tapdata/tapdata-web
    - tapdata/tapdata-connectors
    - tapdata/tapdata-connectors-enterprise
    - tapdata/tapdata-license
    - tapdata/tapdata-common-lib
    - tapdata/tapdata-application
    - tapdata/feishu_robot
    - tapdata/tapdata-cloud
    - tapdata/t-layer3-test
    - tapdata/docs
    - tapdata/docs-en
    - tapdata/mcp-tap-server
    - tapdata/solutions
    - tapdata/fhir-solution
    - tapdata/hazelcast
  # 任务工作树按领域创建；未映射仓库不做全量回退。
  worktree_domains:
    - id: product
      baseline_repository: tapdata/tapdata
      problem_version_repository: tapdata/tapdata
      repositories:
        - tapdata/tapdata
        - tapdata/tapdata-enterprise
        - tapdata/tapdata-web
        - tapdata/tapdata-license
        - tapdata/tapdata-common-lib
        - tapdata/tapdata-application
        - tapdata/tapdata-connectors
        - tapdata/tapdata-connectors-enterprise
    - id: assistant
      baseline_repository: tapdata/feishu_robot
      problem_version_repository: tapdata/feishu_robot
      repositories: [tapdata/feishu_robot]
    - id: automation-test
      baseline_repository: tapdata/t-layer3-test
      problem_version_repository: tapdata/t-layer3-test
      repositories: [tapdata/t-layer3-test]
  branches:
    derive_from: default
    default_branch: main
    default_rule: same_name
    # 任务工作树的基线必须按目标仓库显式解析，禁止从池成员当前分支或隐式 main 猜测。
    baseline_branches:
      tapdata/tapdata: develop
      tapdata/tapdata-enterprise: develop
      tapdata/tapdata-web: develop
      tapdata/tapdata-connectors: develop
      tapdata/tapdata-connectors-enterprise: develop
      tapdata/tapdata-license: main
      tapdata/tapdata-common-lib: main
      tapdata/tapdata-application: main
      tapdata/feishu_robot: master
      tapdata/t-layer3-test: develop
    # 静态新功能开发映射；产品域任务工作树以 tap_align_branches.py plan 结果为准。
    dev_branches:
      tapdata/tapdata: develop
      tapdata/tapdata-cloud: develop
      tapdata/tapdata-common-lib: main
      tapdata/tapdata-connectors: develop
      tapdata/tapdata-connectors-enterprise: develop
      tapdata/tapdata-enterprise: develop
      tapdata/tapdata-license: main
      tapdata/tapdata-web: develop
      tapdata/hazelcast: release-v5.5.0
      tapdata/tapdata-application: main
      tapdata/feishu_robot: master
      tapdata/t-layer3-test: develop
      tapdata/docs: main
      tapdata/docs-en: main
      tapdata/mcp-tap-server: main
      tapdata/solutions: main
      tapdata/fhir-solution: main
    overrides: []

fields:
  owner:
    source: jira_field
    jira_field: assignee
    state: read_only
    required: true
  problem_branch:
    source: jira_description_section
    section: 问题分支
    state: active
    writable: true
  acceptance_criteria:
    source: jira_description_section
    section: 验收标准
    state: active
    writable: true
  issue_analysis:
    source: jira_field
    jira_field: customfield_10092
    state: pending_validation
    writable: false
  fix_details:
    source: jira_field
    jira_field: customfield_10093
    state: pending_validation
    writable: false
  target_repo:
    source: workspace_repo_mapping
    state: active
    required: true
  problem_version:
    source: jira_description_section
    section: 问题版本
    state: active
    writable: true
  target_branch:
    source: task_worktree_mapping
    state: active
    required: true
  problem_summary:
    source: jira_description_section
    section: 问题现象
    state: active
    writable: true
  reproduction_path:
    source: jira_description_section
    section: 复现路径
    state: active
    writable: true
  verification_method:
    source: jira_field
    jira_field: customfield_10049
    state: pending_validation
    writable: false
  risk_level:
    source: jira_field
    jira_field: labels
    state: read_only

statuses:
  打开: waiting_takeover
  待办: waiting_takeover
  To Do: waiting_takeover
  On Hold: waiting_takeover
  正在进行: implementation
  In Progress: implementation
  Pull Request Submitted: implementation
  Tests Passed: implementation
  完成: completed
  Done: completed

transitions:
  # tapdata 真实工作流实测（2026-08-18）：
  #   打开 -> Implementation started(91) -> 正在进行
  #   Pull Request Submitted -> PR Approved(291) -> Merged（Merged 属 completed，AIAgent 默认禁止）
  # 未配的流转（如 正在进行 -> Pull Request Submitted）按快速适配路径渐进补充。
  start_progress:
    name: Implementation started
    id: "91"
    from: [打开]
    to: 正在进行
