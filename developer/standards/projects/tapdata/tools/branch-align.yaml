operation: branch_align
workplane: developer
version: 1
purpose: 定义 TapData 项目分支对齐工具 tap_align_branches.py 的目标行为；它是项目脚本而非 ao-work 通用命令。
task_type: branch_switch
availability:
  source: developer/standards/projects/tapdata/scripts/tap_align_branches.py
  note: 本契约描述项目脚本的目标行为，脚本随标准资产分发；plan 只读、apply 切换分支，均需研发工程师确认，不属于 ao-work 通用能力。
allowed_stages:
  - waiting_takeover
  - takeover_started
  - takeover_resumed
  - implementation
required_inputs:
  - workspace
  - mode
input:
  workspace:
    type: string
    required: true
    allowed_values:
      - tapdata
  mode:
    type: string
    required: true
    allowed_values:
      - list
      - status
      - plan
      - apply
  branch_spec:
    type: string
    required_when:
      - mode_is_plan
      - mode_is_apply
    description: develop、main、release-vX.Y.Z、任务分支，或 <tapdata>,<enterprise>,<web> 格式。
  work_root:
    type: string
    required: false
    description: TapData 多仓工作根目录，目录下应包含 tapdata、tapdata-enterprise、tapdata-web 等仓库。
  remote:
    type: string
    required: false
    default: origin
  no_fetch:
    type: boolean
    required: false
    default: false
  repositories:
    type: string
    required: false
    description: plan 可用逗号分隔的仓库短名限定为任务领域；不得因此扩展为全量挂载。
  json:
    type: boolean
    required: false
    default: false
    description: plan 以机器可读 JSON 输出，供 Runtime 在创建工作树前读取实际目标分支。
  remote_only:
    type: boolean
    required: false
    default: false
    description: plan 仅使用刷新后的 remote refs；Runtime 创建任务工作树时必须启用，禁止回退陈旧本地分支。
preconditions:
  - workspace_must_use_tapdata_repository_profile
  - work_root_must_not_escape_current_tapdata_workspace
  - tapdata_repo_must_exist
  - tapdata_branch_must_exist_local_or_remote
  - apply_requires_no_blocked_rows
hard_rules:
  - plan_is_read_only_and_must_be_run_before_apply_when_target_is_unclear
  - tapdata_application_and_feishu_robot_must_keep_current_branch_by_default
  - keep_current_must_block_when_checkout_is_detached_head
  - tapdata_license_must_use_main_when_tapdata_branch_is_develop
  - common_lib_must_use_develop_when_tapdata_branch_is_develop
  - connectors_must_be_resolved_independently_from_the_same_tapdata_version
  - unresolved_connector_plugin_version_or_release_branch_must_block
  - unresolved_enterprise_or_web_branch_must_block_apply
  - command_must_not_push_git
  - command_must_not_write_jira
  - command_must_not_write_github
output:
  workspace:
    type: string
  mode:
    type: string
  work_root:
    type: string
  remote:
    type: string
  branch_spec:
    type: string
  tap_branch:
    type: string
  blocked:
    type: boolean
  rows:
    type: array
    description: plan --json 直接输出该计划行数组。
  rows_count:
    type: integer
  switched_rows:
    type: array
  switched_count:
    type: integer
  current_stage:
    type: string
  agentic_next_action:
    type: string
failure:
  codes:
    - missing_mode
    - unsupported_mode
    - missing_branch_spec
    - workspace_not_supported
    - work_root_not_found
    - invalid_branch
    - tapdata_branch_not_found
    - branch_alignment_blocked
    - git_branch_alignment_failed
side_effects:
  - list_reads_tapdata_branches
  - status_reads_multi_repo_git_state
  - plan_reads_multi_repo_git_state
  - apply_may_stash_and_pop_dirty_repo_changes
  - apply_modifies_business_repo_git_branches
  - must_not_write_jira
  - must_not_write_github
  - must_not_push_git
human_gate:
  required: false
retry_policy:
  retryable: false
  max_attempts: 1
  redo_from_stage: waiting_takeover
redo_from_stage: waiting_takeover
