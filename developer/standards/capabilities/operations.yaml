schema_version: "1"
workplane: developer
capabilities:
  - id: add_task_comment
    source: contract
    contract: contracts/operations/add-task-comment.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 旧版分类 Jira 评论操作契约，当前 Python Runtime 不提供该命令。
    next_action: 请停止调用旧 add-task-comment；需要写评论时先查询 jira_comment 能力并按当前 plan、apply、readback 协议执行。

  - id: check_ci_status
    source: contract
    contract: contracts/operations/check-ci-status.yaml
    status: implemented
    visibility: public
    commands:
      - [task-run, probe-ci]
    summary: 对 development_change_v2 的当前 PR Head 读取 GitHub Actions，严格核对 Profile 必需检查、5 分钟启动与执行后 10 分钟完成截止时间及修复预算。
    next_action: pending 时按返回间隔重试；failed 时获取唯一匹配 Artifact；passed 时结束本次 AIAgent 运行并停在 PR 审查。

  - id: fetch_ci_artifact
    source: contract
    contract: contracts/operations/fetch-ci-artifact.yaml
    status: implemented
    visibility: public
    commands:
      - [task-run, fetch-ci-artifact]
    summary: 从当前失败 Workflow Run 下载唯一匹配的 GitHub Artifact，核对摘要和版本化大小上限，并安全展开为不可覆盖的受管证据。
    next_action: 下载成功后执行 parse-ci-report；缺失、歧义、过期、越界、链接或路径穿越时停止。

  - id: parse_ci_report
    source: contract
    contract: contracts/operations/parse-ci-report.yaml
    status: implemented
    visibility: public
    commands:
      - [task-run, parse-ci-report]
    summary: 把受管 Artifact 中 Maven Failsafe XML 解析成脱敏、可复现并绑定 Artifact 摘要的结构化失败报告。
    next_action: 先把结构化报告分类；只有明确代码缺陷可进入修复，不支持的格式、统计冲突或其它原因必须人工介入。

  - id: record_ci_remediation
    source: contract
    contract: contracts/operations/record-ci-remediation.yaml
    status: implemented
    visibility: public
    commands:
      - [task-run, record-ci-remediation]
    summary: 只把唯一分类为可重试代码缺陷的 CI 失败事件绑定到授权内修复提交、最终远端 Head 回读和有限修复预算，防止其它失败被自动修复。
    next_action: 记录成功后对新 PR Head 重新执行 probe-ci；预算耗尽时停止并请求研发工程师决策。

  - id: conf_get
    source: contract
    contract: contracts/operations/conf-get.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: effective configuration 单值读取目标契约，尚未迁移到 Python Runtime。
    next_action: 请不要直接解析 Runtime 管理的凭证文件；需要配置事实时请求人工检查并提交能力改进建议。

  - id: contract_validate
    source: contract
    contract: contracts/operations/contract-validate.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 业务工作面契约校验目标契约，尚未作为 ao-work 能力公开。
    next_action: 请停止在业务任务中调用旧 contract-validate；契约维护应交接到 maintainer 工作面。

  - id: doctor
    source: contract
    contract: contracts/operations/doctor.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: developer 综合诊断目标契约，尚未迁移到 Python Runtime。
    next_action: 请分别执行现役 workspace preflight、workspace inspect 和授权检查，保留脱敏结果后提交诊断能力建议。

  - id: feedback_analyze
    source: contract
    contract: contracts/operations/feedback-analyze.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 反馈聚合分析目标契约，尚未迁移到 Python Runtime。
    next_action: 请人工整理脱敏问题事实和重复模式，再交接给 AgenticOps 维护者分析。

  - id: feedback_bundle
    source: contract
    contract: contracts/operations/feedback-bundle.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 脱敏诊断包目标契约，尚未迁移到 Python Runtime。
    next_action: 请人工整理最小脱敏复现材料，不得包含凭证或原始敏感日志，并提交能力改进建议。

  - id: feedback_propose
    source: contract
    contract: contracts/operations/feedback-propose.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 标准改进建议生成目标契约，尚未迁移到 Python Runtime。
    next_action: 请先完成当前业务任务并人工总结优化路径，再交接到独立 maintainer worktree。

  - id: feedback_record_recovery
    source: contract
    contract: contracts/operations/feedback-record-recovery.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 外部写入人工恢复记录目标契约，尚未迁移到 Python Runtime。
    next_action: 请人工回读外部事实并保留脱敏引用，不要把未确认结果写成已完成。

  - id: feedback_report
    source: contract
    contract: contracts/operations/feedback-report.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 工作空间反馈报告目标契约，尚未迁移到 Python Runtime。
    next_action: 请人工汇总当前任务的脱敏结论和下一步，并提交反馈报告能力建议。

  - id: fix_pr_comments
    source: contract
    contract: contracts/operations/fix-pr-comments.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 拉取请求审查意见分类与修复目标契约，尚未迁移到 Python Runtime。
    next_action: 请使用项目认可的审查工具读取意见，遇到取舍时停止并请求研发工程师确认。

  - id: git_commit
    source: runtime
    contract:
    status: implemented
    visibility: public
    commands:
      - [task-run, execute-git-commit]
    summary: 按批准计划、任务分支、manifest 授权范围、执行身份和写前可信基线创建业务任务提交的原子操作；提交后回读 HEAD、校验 author/committer 身份与工作树干净，并记录 external_action + remote_branch_readback 事件。
    next_action: 请在任务分支修改完成后、probe-git 验证前调用 execute-git-commit；必须引用与 manifest 一致的授权。

  - id: git_push_task_branch
    source: runtime
    contract:
    status: implemented
    visibility: public
    commands:
      - [task-run, execute-git-push-task-branch]
    summary: 在任务级授权内推送业务任务分支并回读远端 SHA 的原子操作；保护分支阻断、非快进阻断、授权绑定、远端 SHA 回读与 remote_branch_readback 事件记录。
    next_action: 请在 execute-git-commit 成功后、probe-git 验证前调用；必须引用与 manifest 一致的授权。

  - id: github_pr_create
    source: runtime
    contract:
    status: implemented
    visibility: public
    commands:
      - [task-run, execute-github-pr-create]
    summary: 创建真实 GitHub PR 并回读 number/URL/head/base/merge/CI 事实的原子操作；GitHub actor 身份校验、禁止重复创建、禁止自动 merge、写后回读与 pr_readback 事件记录。
    next_action: 请在 execute-git-push-task-branch 成功后、probe-pr 验证前调用；必须引用与 manifest 一致的授权。

  - id: inspect_task
    source: contract
    contract: contracts/operations/inspect-task.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 旧版富任务检查契约，当前 jira inspect 只提供基础 Jira 事实。
    next_action: 请查询 jira_inspect 能力读取基础 Jira 事实，再由 AI 按项目标准资产分析；不要假设旧富输出已经实现。

  - id: inspect_workspace
    source: contract
    contract: contracts/operations/inspect-workspace.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 旧版 Git 工作区安全摘要契约，当前 workspace inspect 只检查 AI 工作空间身份。
    next_action: 请查询 workspace_inspect 能力确认工作面；业务源码 Git 状态需使用项目认可的只读工具人工核对。

  - id: jira_authorization
    source: contract
    contract: contracts/operations/jira-authorization.yaml
    status: implemented
    visibility: public
    commands:
      - [auth]
    summary: 配置或脱敏查看当前 developer 安装唯一的研发员身份、Git/GitHub 执行身份和 Jira 凭证。
    next_action: 首次使用直接运行 ao-work auth；自动化通过完整非交互参数和标准输入传入 token；查看使用 ao-work auth --show。

  - id: jira_comment
    source: contract
    contract: contracts/operations/jira-comment.yaml
    status: implemented
    visibility: public
    commands:
      - [jira, comment, plan]
      - [jira, comment, apply]
      - [jira, comment, readback]
    summary: 以 plan、apply、readback 协议向 Jira 追加中文评论。
    next_action: 请先生成计划，获得计划编号的明确授权后 apply；结果不明确时只执行 readback。

  - id: jira_transition
    source: contract
    contract: contracts/operations/jira-transition.yaml
    status: implemented
    visibility: public
    commands:
      - [jira, transition, plan]
      - [jira, transition, apply]
      - [jira, transition, readback]
    summary: 以 plan、apply、readback 协议把 Jira 任务卡片流转到项目工作流既有状态；D-037 严格匹配（稳定 ID 优先、名称兜底需唯一且 from/to 匹配、禁止模糊匹配），AIAgent 默认禁止推进完成态，apply 必须授权引用并回读确认。
    next_action: 请先生成计划（目标状态必须来自 profile 映射 ∩ Jira 可用列表），获得计划编号的明确授权后 apply；结果不明确时只执行 readback。

  - id: jira_description
    source: contract
    contract: contracts/operations/jira-description.yaml
    status: implemented
    visibility: public
    commands:
      - [jira, description, plan]
      - [jira, description, apply]
    summary: 以 plan、apply 协议更新 Jira Description 的受控章节，并在 apply 内完成回读。
    next_action: 请先生成计划，获得计划编号的明确授权后 apply；未知结果必须人工检查 Jira，不得盲目重试。

  - id: jira_inspect
    source: runtime
    contract:
    status: implemented
    visibility: public
    commands:
      - [jira, inspect]
    summary: 只读返回当前 Project Profile 下 Jira Issue 的基础事实和凭证配置状态。
    next_action: 请把输出与项目标准资产结合分析；该能力不判断准入、不读取评论和自定义字段，也不写 Jira。

  - id: version
    source: contract
    contract: contracts/operations/version.yaml
    status: implemented
    visibility: public
    commands:
      - [version]
    summary: 只读返回 developer Runtime 发行版本、受管安装目录、首次安装时间、精确 Git HEAD 和可选 Tag 描述。
    next_action: 请直接运行 ao-work version 查询当前安装事实；该命令不检查更新、不要求业务工作空间，也不会读取凭证或修改安装。

  - id: jira_worklog
    source: contract
    contract: contracts/operations/jira-worklog.yaml
    status: implemented
    visibility: public
    commands:
      - [jira, worklog, plan]
      - [jira, worklog, apply]
      - [jira, worklog, readback]
    summary: 以 plan、apply、readback 协议记录中文标题、逐项耗时组成和明确排除等待类别的真实耗时。
    next_action: 请让 included_work 各项秒数之和等于真实总耗时，并明确 excluded_waiting_categories；获得计划编号的授权后 apply，结果不明确时只执行 readback。

  - id: jira_create
    source: contract
    contract: contracts/operations/jira-create.yaml
    status: implemented
    visibility: public
    commands:
      - [jira, create, plan]
      - [jira, create, apply]
      - [jira, create, readback]
    summary: 以 plan、apply、readback 协议在 Jira 项目新建任务：createmeta 实时校验事务类型与必填字段（禁止猜测字段默认值），description 写入幂等 marker，apply 后回读验证，readback 用真实 issue key。建卡无既有任务状态，决策审计由 attempt 文件承载。
    next_action: 请先生成计划（项目 Key、事务类型与必填字段来自 createmeta），获得计划编号的明确授权后 apply；结果不明确时只执行 readback，不要重复写入。

  - id: list_tasks
    source: contract
    contract: contracts/operations/list-tasks.yaml
    status: implemented
    visibility: public
    commands:
      - [jira, list]
    summary: 列出当前研发员名下可处理任务（契约：分配给当前用户、按优先级+更新时间排序、一页 10 个）：过滤条件来自 Project Profile task_query（缺省 assignee = currentUser() AND resolution = Unresolved），排序由 Runtime 统一为 ORDER BY priority DESC, updated ASC，走 /rest/api/3/search/jql 端点，只读返回 key/summary/status/issue_type/priority/updated 与总数。
    next_action: 请在任务接管前使用 jira list 查看名下待办；本操作只读，不写 Jira。

  - id: policy_rollback
    source: contract
    contract: contracts/operations/policy-rollback.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 策略回滚目标契约，尚未迁移到 Python Runtime。
    next_action: 请停止业务任务自动化并把策略回滚请求交接给 AgenticOps 维护者确认。

  - id: policy_update
    source: contract
    contract: contracts/operations/policy-update.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 策略更新目标契约，尚未迁移到 Python Runtime。
    next_action: 请勿从 developer 工作面修改共享策略；把改进建议交接给 maintainer 工作面。

  - id: policy_validate
    source: contract
    contract: contracts/operations/policy-validate.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 策略校验目标契约，尚未迁移到 Python Runtime。
    next_action: 请按当前版本化规则人工检查冲突，发现问题后交接给 AgenticOps 维护者。

  - id: preflight
    source: contract
    contract: contracts/operations/preflight.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 旧版综合环境预检契约，其范围大于当前 workspace preflight。
    next_action: 请查询 workspace_preflight 能力检查当前已初始化工作空间；其它 GitHub 和工具检查需按项目规则补充。

  - id: prepare_pr
    source: contract
    contract: contracts/operations/prepare-pr.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 拉取请求准备目标契约，尚未迁移到 Python Runtime。
    next_action: 请按项目分支与拉取请求规则人工准备，推送和创建拉取请求仍需有效授权。

  - id: profile_resolve
    source: contract
    contract: contracts/operations/profile-resolve.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: effective Project Profile 解析目标契约，尚未迁移到 Python Runtime。
    next_action: 请不要猜测合并后的字段；需要此能力时停止任务并提交 profile_resolve 改进建议。

  - id: profile_rollback
    source: contract
    contract: contracts/operations/profile-rollback.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: Project Profile 回滚目标契约，尚未迁移到 Python Runtime。
    next_action: 请停止业务自动化并把 Profile 回滚请求交接给 AgenticOps 维护者确认。

  - id: profile_update
    source: contract
    contract: contracts/operations/profile-update.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: Project Profile 更新目标契约，尚未迁移到 Python Runtime。
    next_action: 请勿从 developer 工作面修改共享 Profile；把改进建议交接给 maintainer 工作面。

  - id: profile_validate
    source: contract
    contract: contracts/operations/profile-validate.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: Project Profile 完整映射校验目标契约，尚未迁移到 Python Runtime。
    next_action: 请按当前 Profile 和项目规则人工检查缺口，并把缺口清单交接给维护者。

  - id: read_pr_comments
    source: contract
    contract: contracts/operations/read-pr-comments.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 拉取请求评论读取目标契约，尚未迁移到 Python Runtime。
    next_action: 请使用项目认可的 GitHub 只读工具获取审查意见，并保留稳定拉取请求引用。

  - id: release_agent
    source: contract
    contract: contracts/operations/release-agent.yaml
    status: capability_gap
    visibility: public
    commands: []
    summary: 任务运行结束与审计收口目标契约，尚未迁移到 Python Runtime；developer 不依赖 Jira Agentic 自定义字段。
    next_action: 请通过 Jira 中文结果评论和本地任务审计记录结束事实；不要写入或清理 Agentic 自定义字段。

  - id: report_write
    source: runtime
    contract:
    status: implemented
    visibility: internal
    commands:
      - [report, write]
    summary: Runtime 内部写入当前任务 analysis 或 plan 本地报告，不是 Jira 回写或完成证据。
    next_action: 仅由经过版本化 Skill 的任务流程调用；不得把本地报告视为 Jira 事实。

  - id: repository_branch_assess
    source: contract
    contract: contracts/operations/repository-branch-assess.yaml
    status: implemented
    visibility: public
    commands:
      - [task, repositories, assess]
    summary: 只读刷新源码池远端并生成逐仓分支建议与固定 SHA；建议不具有建树或编码权限。
    next_action: 向研发工程师展示完整建议、问题版本和差异，再进入仓库分支关系确认。

  - id: repository_branch_confirm
    source: contract
    contract: contracts/operations/repository-branch-confirm.yaml
    status: implemented
    visibility: public
    commands:
      - [task, repositories, confirm]
    summary: 校验研发工程师修正后的完整仓库分支关系；只有显式 confirm 才持久化，且确认时不创建工作树。
    next_action: 后续仅在实际需要修改某仓库时，从确认表按需准备对应工作树。

  - id: task_worktree_prepare
    source: contract
    contract: contracts/operations/task-worktree-prepare.yaml
    status: implemented
    visibility: public
    commands:
      - [task, worktrees, prepare]
    summary: 只从用户确认关系表为一个仓库创建或精确复用任务子工作树，并绑定任务分支与来源上下文。
    next_action: 在返回的精确任务工作树中完成该仓库的编码与验证；新增仓库须重新确认范围。

  - id: task_worktree_cleanup
    source: contract
    contract: contracts/operations/task-worktree-cleanup.yaml
    status: implemented
    visibility: public
    commands:
      - [task, worktrees, cleanup]
    summary: Jira 完成总结与完成状态回读后，整体预检并非强制清理任务登记的精确子工作树，永不删除源码池成员。
    next_action: 任一 dirty、Head 漂移或远端未承接均停止；满足门禁后一次清理全部登记工作树。

  - id: resume_takeover
    source: contract
    contract: contracts/operations/resume-takeover.yaml
    status: implemented
    visibility: public
    commands:
      - [task, resume]
    summary: 恢复已接管或处于部分完成状态的 Jira 任务执行上下文（只读，不写 Jira）：通过统一恢复读取器定位本地运行，校验接管快照、业务阶段、事件、Jira 经办人与状态映射，输出确定的恢复动作。
    next_action: 请在已接管任务中断后续工时使用 task resume 恢复；所有权不一致或阶段不允许时按失败码人工核对。

  - id: takeover_task
    source: contract
    contract: contracts/operations/takeover-task.yaml
    status: implemented
    visibility: public
    commands:
      - [takeover]
    summary: Jira 任务单命令接管能力：不带 issue_key 时只读列出候选；带 issue_key 时由 Runtime 绑定明确的接管指令，校验经办人和状态映射，自动判断新接管、接纳存量或恢复，并通过同一 Saga 完成 Comment、Status 与本地状态回读。不读写 Agentic 自定义字段。
    next_action: 无编号时展示候选并由研发工程师选择；带编号时直接执行 ao-work takeover <KEY>。接管完成后先分析并确认完整仓库分支关系，确认前不得创建工作树或建立仓库来源快照。

  - id: task_start
    source: runtime
    contract:
    status: implemented
    visibility: internal
    commands:
      - [task, start]
    summary: 兼容旧运行的内部来源上下文准备原子能力；用户任务入口固定为 takeover，不应直接选择 task start。
