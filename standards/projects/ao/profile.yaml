schema_version: 1
profile_id: ao
connection_id: tapdata-cloud

jira:
  project_key: AO
  issue_types:
    - Agentic 缺陷
    - 任务
  task_query: project = AO AND assignee = currentUser() AND statusCategory != Done ORDER BY updated DESC

fields:
  owner:
    source: jira_field
    jira_field: assignee
    state: read_only
    required: true
  agentic_id:
    source: jira_field
    jira_field: customfield_10364
    state: pending_validation
  agentic_run_id:
    source: jira_field
    jira_field: customfield_10365
    state: pending_validation
  target_branch:
    source: jira_field
    jira_field: customfield_10360
    state: pending_validation
  verification_method:
    source: jira_description_section
    section: 验证方式
    state: active

statuses:
  待办: waiting_takeover
  待接管: waiting_takeover
  正在进行: implementation
  执行中: implementation
  等待决策: implementation
  已完成: completed
  完成: completed

transitions:
  start_progress:
    name: In Progress
  complete:
    name: Done
