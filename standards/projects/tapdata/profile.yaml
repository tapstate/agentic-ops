schema_version: 1
profile_id: tapdata
connection_id: tapdata-cloud

jira:
  project_key: TAP
  issue_types:
    - Story
    - 故事
    - Bug
    - 缺陷
    - Task
    - 任务
  task_query: project = TAP AND assignee = currentUser() AND statusCategory != Done ORDER BY updated DESC

fields:
  owner:
    source: jira_field
    jira_field: assignee
    state: read_only
    required: true
  problem_branch:
    source: jira_description_section
    section: 问题分支
    state: active
  acceptance_criteria:
    source: jira_description_section
    section: 验收标准
    state: active
  issue_analysis:
    source: jira_field
    jira_field: customfield_10092
    state: active
    writable: true
  fix_details:
    source: jira_field
    jira_field: customfield_10093
    state: active
    writable: true
  target_repo:
    source: workspace_repo_mapping
    state: active
    required: true
  target_branch:
    source: jira_description_section
    section: 修复分支
    state: active
  problem_summary:
    source: jira_description_section
    section: 问题现象
    state: active
  reproduction_path:
    source: jira_description_section
    section: 复现路径
    state: active
  verification_method:
    source: jira_field
    jira_field: customfield_10049
    state: active
    writable: true
  risk_level:
    source: jira_field
    jira_field: labels
    state: read_only

statuses:
  打开: waiting_takeover
  待办: waiting_takeover
  To Do: waiting_takeover
  On Hold: waiting_takeover
  正在进行: implementation
  In Progress: implementation
  Pull Request Submitted: implementation
  Tests Passed: implementation
  完成: completed
  Done: completed

transitions:
  start_progress:
    name: Start Progress
  complete:
    name: Tests Pass
