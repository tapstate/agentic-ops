operation: jira_authorization
version: 1
allowed_modes:
  - source_maintenance
  - project_execution
actions:
  - list
  - show
  - set
  - remove
  - verify
account:
  cardinality: one_per_business_project_workspace
  shared_install_has_identity: false
  cross_workspace_credential_inheritance: false
  precedence:
    - process_environment
    - workspace
  writable:
    - workspace
connection_resolution:
  - project_profile
  - sole_installed_connection
  - explicit_advanced_override
security:
  - token_must_not_be_accepted_as_command_argument
  - token_must_not_be_returned_or_logged
  - credential_file_mode_must_be_0600
  - writes_must_be_locked_and_atomic
  - email_and_token_must_share_one_source
  - verify_must_read_back_authenticated_identity
failure:
  - authorization_email_invalid
  - authorization_token_empty
  - authorization_no_change
  - jira_credentials_missing
  - jira_authorization_failed
  - jira_connection_failed
