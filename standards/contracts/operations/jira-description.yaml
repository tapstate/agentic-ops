operation: jira_description
version: 1
allowed_modes:
  - project_execution
protocol:
  - plan
  - apply
  - readback
preconditions:
  - task_identity_matches_connection_profile_and_issue
  - current_user_matches_assignee
  - only_confirmed_managed_sections_are_supplied
side_effects:
  - update_only_named_description_sections
preserves:
  - unmanaged_description_content
unknown_result:
  retry_safe: false
  next_action: readback
