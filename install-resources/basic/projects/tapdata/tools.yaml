project: tapdata
tools:
  branch-align:
    command: agentic-cli tapdata branch-align
    summary: TapData 多仓分支对齐
    actions:
      - list
      - status
      - plan
      - apply
    risk:
      list: read_only
      status: read_only
      plan: read_only
      apply: local_git_branch_switch
    human_gate:
      apply: false
    legacy_alias:
      - agentic-cli switch-branch
    contract: switch_branch
    examples:
      - agentic-cli tapdata branch-align list TAP-12289
      - agentic-cli tapdata branch-align status
      - agentic-cli tapdata branch-align plan develop
      - agentic-cli tapdata branch-align apply develop
