task_class: technical_task
template: templates/admission/technical-task-missing.md
required_fields:
  - acceptance_criteria
  - target_repo
  - verification_method
  - risk_level
guidance:
  acceptance_criteria:
    label: 验收标准
    location: Jira 描述 `验收标准` 章节或项目字段
    example: 技术任务目标达成，相关命令或检查项通过。
    description: 说明任务完成后怎样判断可以验收。
  target_repo:
    label: 目标仓库
    location: Jira 组件、标签、项目仓库映射或项目字段
    example: tapdata/tapdata
    description: 说明本次任务应修改或检查的代码仓库。
  verification_method:
    label: 验证方式
    location: Jira 验证方式字段或项目字段
    example: 执行对应脚本、单元测试或检查命令。
    description: 说明 AIAgent 完成后必须执行的验证命令或人工验证方式。
  risk_level:
    label: 风险等级
    location: Jira 风险字段或风险标签
    example: T3
    description: 说明任务风险级别，便于决定人工门禁和验证强度。
