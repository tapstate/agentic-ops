workspace: tapdata

jira:
  user: "<jira-user>"
  base_url: https://tapdata.atlassian.net
  project: TAP
  task_query: "project = TAP AND assignee = currentUser() AND statusCategory != Done ORDER BY updated DESC"

jira_form_mapping:
  fields:
    owner:
      source: jira_field
      jira_field: assignee
      required_from_stage: waiting_takeover
    problem_branch:
      source: jira_description_section
      section: "问题分支"
      required_from_stage: takeover_gate
    acceptance_criteria:
      source: jira_description_section
      section: "验收标准"
    issue_analysis:
      source: jira_field
      jira_field: customfield_10092
      writable: true
      required_from_stage: implementation
    fix_details:
      source: jira_field
      jira_field: customfield_10093
      writable: true
      required_from_stage: implementation
    target_repo:
      source: workspace_repo_mapping
      fallback: workspace_repo_mapping
      required_from_stage: takeover_gate
    target_branch:
      source: jira_description_section
      section: "修复分支"
      required_from_stage: takeover_gate
    problem_summary:
      source: jira_description_section
      section: "问题现象"
      required_from_stage: takeover_gate
    reproduction_path:
      source: jira_description_section
      section: "复现路径"
    verification_method:
      source: jira_field
      jira_field: customfield_10049
      writable: true
    risk_level:
      source: jira_field
      jira_field: labels
    agentic_id:
      source: jira_comment
      required_from_stage: takeover_gate
    agentic_takeover_at:
      source: jira_comment
      required_from_stage: takeover_gate

task_class_mapping:
  issue_types:
    Story: feature_change
    故事: feature_change
    Bug: bug_fix
    缺陷: bug_fix
    Task: technical_task
    任务: technical_task
  labels:
    investigation: technical_task
    defect: bug_fix
    bug: bug_fix
  components:
    backend: technical_task
    frontend: technical_task

standard_process_mapping:
  feature_change: development_change_v1
  bug_fix: development_change_v1
  technical_task: development_change_v1

status_mapping:
  打开: waiting_takeover
  待办: waiting_takeover
  To Do: waiting_takeover
  On Hold: waiting_takeover
  正在进行: implementation
  In Progress: implementation
  Pull Request Submitted: implementation
  Tests Passed: implementation
  完成: completed
  Done: completed

transition_mapping:
  start_progress: implementation
  complete: completed

jira_transition_mapping:
  start_progress:
    name: "Start Progress"
  complete:
    name: "Tests Pass"

github:
  organization: tapdata
  repositories:
    default: tapdata/tapdata
    by_component:
      tapdata: tapdata/tapdata
      connectors: tapdata/tapdata-connectors
      connectors-enterprise: tapdata/tapdata-connectors-enterprise
      enterprise: tapdata/tapdata-enterprise
      web: tapdata/tapdata-web
      common-lib: tapdata/tapdata-common-lib
      license: tapdata/tapdata-license
      mcp: tapdata/mcp-tap-server
    by_label:
      backend: tapdata/tapdata
      enterprise: tapdata/tapdata-enterprise
      frontend: tapdata/tapdata-web
      connector: tapdata/tapdata-connectors
      connector-enterprise: tapdata/tapdata-connectors-enterprise
      connectors-enterprise: tapdata/tapdata-connectors-enterprise
      license: tapdata/tapdata-license
      pdk: tapdata/tapdata-connectors
    by_issue_type:
      缺陷: tapdata/tapdata
      Bug: tapdata/tapdata

local:
  workspace_root: "<project-ai-workspace>"
  source_root: "<project-ai-workspace>/repos/tapdata"
  runs_dir: "<project-ai-workspace>/.agentic-ops/runs"
  run_logs_dir: "<project-ai-workspace>/.agentic-ops/run-logs"
  feedback_dir: "<project-ai-workspace>/.agentic-ops/feedback"

standards:
  - company/standards/core-hard-rules.md
  - projects/tapdata/standards/development-rules.md

human_gates:
  - push
  - create_pr
  - merge
  - transition_jira_status
  - scope_change

review_gates:
  development_engineer_review:
    role: development_engineer
    decision_field: development_engineer_decision
    returned_next_action: fix_and_verify
  pr_review:
    role: code_reviewer
    decision_field: reviewer_decision
    returned_next_action: fix_and_verify
  qa_verification:
    role: qa
    decision_field: qa_decision
    returned_next_action: redo_previous_stage

retry_redo:
  verification_failed:
    retry: true
    max_attempts: 3
    agentic_next_action: fix_and_verify
  scope_changed:
    retry: false
    redo_from_stage: waiting_takeover
    agentic_next_action: redo_previous_stage

templates:
  takeover_success: templates/evidence/takeover-success.md
  takeover_failed: templates/evidence/takeover-failed.md
  blocked: templates/evidence/blocked.md
  development_completed: templates/evidence/development-completed.md
  defect_admission_analysis: projects/tapdata/templates/defect/admission-analysis-comment.md
  defect_admission_decision: projects/tapdata/templates/defect/admission-decision-comment.md
  defect_description_sections: projects/tapdata/templates/defect/description-sections.yaml
  defect_fix_plan: projects/tapdata/templates/defect/fix-plan-comment.md
  defect_plan_decision: projects/tapdata/templates/defect/plan-decision-comment.md
  defect_completion_form: projects/tapdata/templates/defect/completion-form.yaml
  defect_completion_evidence: projects/tapdata/templates/defect/completion-evidence-comment.md
