operation: profile_resolve
version: 1
purpose: 解析公司、项目、个人和工作空间 overlay 后的 effective profile，并输出字段来源层级。
task_type: profile_resolution
allowed_stages:
  - design_review
  - implementation
  - profile_update_required
required_inputs:
  - workspace
input:
  workspace:
    type: string
    required: true
output:
  workspace:
    type: string
  jira_user:
    type: string
  jira_project:
    type: string
  source_root:
    type: string
  layers:
    type: array
  next_action:
    type: string
failure:
  codes:
    - missing_workspace
    - workspace_root_failed
    - profile_resolve_failed
    - profile_resolve_validation_failed
side_effects:
  - must_not_write_jira
  - must_not_modify_profile
  - must_not_modify_code
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: profile_update_required
redo_from_stage: profile_update_required
