operation: workspace_init
version: 1
purpose: 初始化具体项目的 AI 工作空间运行目录。
task_type: workspace_initialization
allowed_stages:
  - installed
required_inputs:
  - project
input:
  project:
    type: string
    required: true
  jira_user:
    type: string
    required: false
  interactive:
    type: boolean
    required: false
  jira_project:
    type: string
    required: false
  source_root:
    type: string
    required: false
  jira_base_url:
    type: string
    required: false
  jira_token_env:
    type: string
    required: false
  confirm_existing_config:
    type: boolean
    required: false
preconditions:
  - workspace_root_must_be_available
  - workspace_root_must_be_writable
  - existing_config_requires_confirmation
  - interactive_mode_requires_terminal
output:
  workspace:
    type: string
  workspace_root:
    type: string
  source_root:
    type: string
  jira_user:
    type: string
  jira_project:
    type: string
  profile:
    type: string
  agent_config:
    type: string
  agent_instructions:
    type: string
  runs_dir:
    type: string
  run_logs_dir:
    type: string
  feedback_dir:
    type: string
  jira_config_status:
    type: string
  jira_config_path:
    type: string
  jira_token_env:
    type: string
  jira_config_next_action:
    type: string
  next_action:
    type: string
failure:
  codes:
    - missing_workspace
    - missing_project
    - missing_jira_user
    - interactive_terminal_required
    - interactive_input_required
    - interactive_input_failed
    - existing_config_confirmation_required
    - workspace_root_failed
    - workspace_init_failed
    - jira_config_failed
    - agent_config_failed
    - agent_instructions_failed
side_effects:
  - may_write_workspace_state
  - may_write_personal_jira_config
  - must_not_write_jira
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: installed
redo_from_stage: installed
