operation: workspace_init
version: 2
purpose: 确认研发员身份、Jira 项目空间和授权后初始化业务项目工作空间。
task_type: workspace_initialization
allowed_stages:
  - installed
input:
  interactive:
    type: boolean
    required: false
    default: true
  project_profile:
    type: string
    required_in_non_interactive: true
  agent_id:
    type: string
    required_in_non_interactive: true
    pattern: "^[0-9A-Za-z_-]+$"
    interactive_default: normalized_lowercase_hostname
  source_root:
    type: string
    required: false
  jira_email:
    type: string
    required_with_token_stdin: true
  jira_token:
    type: secret
    accepted_sources:
      - hidden_prompt
      - standard_input
    command_argument_forbidden: true
confirmation:
  required: true
  fields:
    - agent_id
    - workspace_root
    - project_profile
    - jira_base_url
    - jira_project
    - masked_jira_account
    - repository
    - source_root
preconditions:
  - workspace_boundary_must_be_valid
  - existing_config_requires_confirmation
  - agent_id_must_be_valid_and_not_conflict
  - project_profile_and_repository_mapping_must_exist
  - jira_identity_and_project_access_must_be_verified
  - source_repository_must_be_readable
output:
  agent_id:
    type: string
  project_profile:
    type: string
  jira_project:
    type: string
  jira_account:
    type: masked_string
  jira_identity:
    type: string
  repository:
    type: string
  source_root:
    type: string
  preflight_status:
    type: string
  post_preflight_status:
    type: string
  agentic_next_action:
    type: string
failure:
  codes:
    - interactive_terminal_required
    - missing_project_profile
    - missing_agent_id
    - agent_id_invalid
    - agent_id_conflict
    - workspace_boundary_invalid
    - workspace_not_writable
    - existing_config_confirmation_required
    - jira_credentials_missing
    - authorization_email_invalid
    - authorization_token_invalid
    - jira_authorization_failed
    - jira_workspace_mismatch
    - workspace_repository_mapping_missing
    - source_repository_access_failed
    - source_checkout_failed
side_effects:
  - may_clone_source_repository
  - may_write_workspace_state
  - may_write_workspace_credentials
  - may_update_non_authoritative_workspace_index
  - must_not_write_jira
security:
  - agent_json_completion_marker_written_last
  - token_must_not_be_logged_or_returned
  - workspace_index_must_not_store_credentials_or_authorize
