operation: update_apply
version: 2
purpose: 校验 release manifest 与 checksum，暂存版本化产物，保存上一状态并原子切换当前 CLI 与资产元数据。
task_type: update
allowed_stages:
  - update_required
  - update_available
  - update_apply
optional_inputs:
  - manifest
  - manifest_url
  - install_dir
  - target
input:
  manifest:
    type: string
    required: false
  manifest_url:
    type: string
    required: false
  install_dir:
    type: string
    required: false
  target:
    type: string
    required: false
preconditions:
  - exactly_one_manifest_source_must_be_available
  - release_manifest_must_be_valid
  - local_manifest_cli_version_must_equal_running_cli
  - remote_artifacts_must_match_checksums
  - install_dir_must_be_writable
output:
  version:
    type: string
  asset_version:
    type: string
  previous_version:
    type: string
  previous_asset_version:
    type: string
  downloaded_artifacts:
    type: array
  activated_binary:
    type: string
  agentic_next_action:
    type: string
failure:
  codes:
    - missing_manifest
    - checksum_mismatch
    - update_apply_failed
side_effects:
  - may_download_release_artifacts
  - may_write_versioned_install_artifacts
  - may_switch_active_binary_atomically
  - may_write_local_install_state
  - must_not_write_jira
  - must_not_modify_business_repo
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: update_check
redo_from_stage: update_check
