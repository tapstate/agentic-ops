operation: update_apply
version: 1
purpose: 基于 managed clone 应用 latest 更新，校验 install-resources/checksums.txt，刷新本机二进制并保留 previous ref。
task_type: update
allowed_stages:
  - update_required
  - update_available
  - update_apply
optional_inputs:
  - install_dir
input:
  install_dir:
    type: string
    required: false
preconditions:
  - install_dir_must_be_managed_clone
  - checksums_must_exist
  - install_dir_must_be_writable
output:
  install_dir:
    type: string
  bin:
    type: string
  target:
    type: string
  previous_ref:
    type: string
  current_ref:
    type: string
  next_action:
    type: string
failure:
  codes:
    - managed_clone_missing
    - checksum_mismatch
    - update_apply_failed
side_effects:
  - may_write_global_install_dir
  - may_fetch_git_remote
  - may_write_local_install_state
  - must_not_write_jira
  - must_not_modify_code
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: update_check
redo_from_stage: update_check
