operation: update_check
version: 2
purpose: 读取本地或远程 release manifest，判断 CLI 与资产 exact_pair 兼容状态，并保存本地门禁状态。
task_type: update
allowed_stages:
  - installed
  - update_check
  - update_available
  - update_required
  - failed
optional_inputs:
  - manifest
  - manifest_url
  - install_dir
input:
  manifest:
    type: string
    required: false
  manifest_url:
    type: string
    required: false
  install_dir:
    type: string
    required: false
preconditions:
  - exactly_one_manifest_source_must_be_available
  - release_manifest_must_be_valid
output:
  current_version:
    type: string
  current_asset_version:
    type: string
  latest_version:
    type: string
  asset_version:
    type: string
  min_cli_version:
    type: string
  min_asset_version:
    type: string
  compatibility_policy:
    type: string
  compatibility_state:
    type: string
  migration_required:
    type: boolean
  blocked_operations:
    type: array
  agentic_next_action:
    type: string
failure:
  codes:
    - missing_manifest
    - update_manifest_invalid
    - update_state_write_failed
side_effects:
  - may_read_remote_manifest
  - may_write_local_update_state
  - must_not_apply_update
  - must_not_write_jira
  - must_not_modify_code
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: update_check
redo_from_stage: update_check
