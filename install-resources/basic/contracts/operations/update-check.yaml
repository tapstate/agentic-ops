operation: update_check
version: 1
purpose: 检查 managed clone 当前 ref 与 origin/main latest 是否一致，并返回是否需要更新。
task_type: update
allowed_stages:
  - installed
  - update_check
  - failed
required_inputs:
  - install_dir
input:
  install_dir:
    type: string
    required: true
preconditions:
  - install_dir_must_be_managed_clone
  - git_remote_must_be_available
output:
  current_ref:
    type: string
  latest_ref:
    type: string
  update_available:
    type: boolean
  severity:
    type: string
    enum:
      - optional
      - recommended
      - required
  reason:
    type: string
  blocked_operations:
    type: array
  next_action:
    type: string
failure:
  codes:
    - managed_clone_missing
    - git_fetch_failed
side_effects:
  - must_not_modify_install_dir
  - may_fetch_git_remote
  - must_not_write_jira
  - must_not_modify_code
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: update_check
redo_from_stage: update_check
