operation: takeover_task
version: 1
purpose: 研发工程师授权 AIAgent 接管一个已进入迭代的任务。
task_type: task_takeover
allowed_stages:
  - waiting_takeover
  - takeover_gate
required_inputs:
  - issue_key
  - workspace
input:
  issue_key:
    type: string
    required: true
  workspace:
    type: string
    required: true
preconditions:
  - current_user_must_match_owner
  - agentic_id_must_be_empty_or_match_agent_id
  - task_class_must_be_mapped_to_standard_process
  - issue_must_be_in_allowed_project
  - jira_status_must_map_to_entry_stage
output:
  workspace:
    type: string
  issue_key:
    type: string
  agentic_run_id:
    type: string
  agent_id:
    type: string
  agentic_id:
    type: string
  agentic_takeover_at:
    type: string
  agentic_heartbeat_at:
    type: string
  task_type:
    type: string
  task_class:
    type: string
  task_class_source:
    type: string
  process_id:
    type: string
  current_stage:
    type: string
    enum:
      - takeover_started
      - blocked
      - waiting_owner_confirmation
  target_repo:
    type: string
  agentic_next_action:
    type: string
    enum:
      - proceed
      - ask_owner
      - blocked
failure:
  codes:
    - owner_mismatch
    - assignee_mismatch
    - assignee_changed
    - agent_ownership_conflict
    - task_class_mapping_gap
    - standard_process_mapping_gap
    - unknown_jira_status
    - invalid_takeover_stage
    - jira_adapter_config_failed
    - jira_issue_read_failed
    - jira_current_user_failed
    - real_jira_confirmation_required
    - missing_jira_write_mapping
    - jira_transition_mapping_gap
    - jira_takeover_atomic_write_failed
    - jira_takeover_readback_failed
    - jira_takeover_readback_mismatch
    - event_write_failed
    - missing_permission
    - workflow_transition_not_allowed
  context:
    jira_transition_mapping_gap:
      may_include:
        remote_write_completed:
          type: boolean
        readback_verified:
          type: boolean
        retry_safe:
          type: boolean
        agentic_run_id:
          type: string
        issue_key:
          type: string
    jira_takeover_atomic_write_failed:
      may_include:
        remote_write_completed:
          type: boolean
        readback_verified:
          type: boolean
        retry_safe:
          type: boolean
        agentic_run_id:
          type: string
        issue_key:
          type: string
    jira_takeover_readback_failed:
      may_include:
        remote_write_completed:
          type: boolean
        readback_verified:
          type: boolean
        retry_safe:
          type: boolean
        agentic_run_id:
          type: string
        issue_key:
          type: string
    jira_takeover_readback_mismatch:
      may_include:
        remote_write_completed:
          type: boolean
        readback_verified:
          type: boolean
        retry_safe:
          type: boolean
        agentic_run_id:
          type: string
        issue_key:
          type: string
    event_write_failed:
      may_include:
        remote_write_completed:
          type: boolean
        readback_verified:
          type: boolean
        retry_safe:
          type: boolean
        agentic_run_id:
          type: string
        issue_key:
          type: string
side_effects:
  - may_write_jira_ownership
  - may_transition_jira_status
  - may_create_takeover_record
  - may_write_local_event
  - must_not_modify_code
  - must_not_create_pr
human_gate:
  required: false
retry_policy:
  retryable: false
  max_attempts: 0
  redo_from_stage: takeover_gate
redo_from_stage: takeover_gate
