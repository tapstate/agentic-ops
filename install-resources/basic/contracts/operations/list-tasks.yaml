operation: list_tasks
version: 1
purpose: 列出当前 owner 可处理任务。
task_type: task_listing
allowed_stages:
  - initialized
required_inputs:
  - workspace
input:
  workspace:
    type: string
    required: true
preconditions:
  - workspace_must_be_initialized
  - current_user_must_be_known
  - profile_task_query_must_be_valid
output:
  workspace:
    type: string
  tasks:
    type: array
  next_action:
    type: string
failure:
  codes:
    - missing_workspace
    - workspace_not_initialized
    - current_user_unavailable
    - task_query_failed
    - jira_adapter_config_failed
    - jira_search_failed
side_effects:
  - must_not_write_jira
  - must_not_modify_code
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: initialized
redo_from_stage: initialized
