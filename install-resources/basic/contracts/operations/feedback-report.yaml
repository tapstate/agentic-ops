operation: feedback_report
version: 1
purpose: 按需生成当前工作空间的 AIAgent 执行分析报告，用于发现重复问题和 AgenticOps 改进建议。
task_type: feedback_reporting
allowed_stages:
  - evidence_written
  - blocked
  - completed
required_inputs:
  - workspace
  - date
input:
  workspace:
    type: string
    required: true
  date:
    type: string
    required: true
    description: 第一阶段作为兼容过滤和报告命名参数，不代表必须生成日报。
preconditions:
  - workspace_must_be_initialized
  - feedback_events_must_be_readable
output:
  workspace:
    type: string
  date:
    type: string
  runs:
    type: integer
  succeeded:
    type: integer
  blocked:
    type: integer
  failed:
    type: integer
  missing_fields:
    type: object
    optional: true
  report:
    type: string
  next_action:
    type: string
failure:
  codes:
    - workspace_root_failed
    - event_read_failed
    - report_write_failed
side_effects:
  - may_write_workspace_feedback
  - must_not_write_jira
  - must_not_replace_task_audit_submission
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: evidence_written
redo_from_stage: evidence_written
