operation: assets_install
version: 2
purpose: 校验源目录资产 manifest 与当前 CLI 的 exact_pair 关系后，将版本化运行资产安装到全局目录。
task_type: asset_installation
allowed_stages:
  - installed
  - asset_update_required
required_inputs:
  - source
  - version
optional_inputs:
  - install_dir
input:
  source:
    type: string
    required: true
  version:
    type: string
    required: true
  install_dir:
    type: string
    required: false
preconditions:
  - source_manifest_must_exist
  - asset_version_must_match_manifest
  - current_cli_must_match_exact_pair
  - asset_source_must_be_declared
  - install_dir_must_be_writable
output:
  asset_version:
    type: string
  assets_dir:
    type: string
  current:
    type: string
  compatibility_policy:
    type: string
  agentic_next_action:
    type: string
failure:
  codes:
    - missing_source
    - missing_asset_version
    - assets_install_failed
side_effects:
  - may_write_global_install_dir
  - may_write_local_install_state
  - must_not_modify_project_workspace
  - must_not_modify_business_repo
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: installed
redo_from_stage: installed
