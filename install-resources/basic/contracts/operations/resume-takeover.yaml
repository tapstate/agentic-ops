operation: resume_takeover
version: 1
purpose: 恢复一个已经存在的任务接管记录。
task_type: task_takeover
allowed_stages:
  - takeover_started
  - blocked
required_inputs:
  - workspace
  - run_id
input:
  workspace:
    type: string
    required: true
  run_id:
    type: string
    required: true
preconditions:
  - run_must_exist
  - run_workspace_must_match
  - run_issue_must_match
  - current_user_must_match_owner
  - current_agent_id_must_match_agent_id
  - local_state_must_be_verifiable
output:
  workspace:
    type: string
  issue_key:
    type: string
  run_id:
    type: string
  agent_id:
    type: string
  current_agent_id:
    type: string
  task_class:
    type: string
  process_id:
    type: string
  previous_stage:
    type: string
  current_stage:
    type: string
  next_action:
    type: string
failure:
  codes:
    - missing_run_id
    - run_not_found
    - workspace_mismatch
    - issue_mismatch
    - assignee_changed
    - agent_ownership_conflict
    - local_state_mismatch
side_effects:
  - may_write_local_event
  - must_not_create_pr
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: takeover_gate
redo_from_stage: takeover_gate
