operation: update_task_description_sections
version: 1
purpose: 安全合并 Jira Description 的指定章节，保留未指定内容。
task_type: jira_write
allowed_stages:
  - waiting_takeover
  - takeover_gate
  - implementation
required_inputs:
  - issue_key
  - workspace
  - sections_file
input:
  issue_key:
    type: string
    required: true
  workspace:
    type: string
    required: true
  sections_file:
    type: string
    required: true
  agentic_run_id:
    type: string
    required: false
preconditions:
  - current_user_must_match_owner_and_assignee
  - agentic_id_must_be_empty_or_match_agent_id
  - agentic_run_id_must_match_issue_when_provided
  - description_must_be_safe_to_merge
  - real_jira_write_must_be_confirmed
output:
  workspace:
    type: string
  issue_key:
    type: string
  agentic_run_id:
    type: string
  updated_section_count:
    type: integer
  current_stage:
    type: string
  agentic_next_action:
    type: string
failure:
  codes:
    - missing_issue_key
    - missing_sections_file
    - sections_file_read_failed
    - empty_description_sections
    - invalid_description_section
    - jira_adapter_config_failed
    - jira_issue_read_failed
    - issue_not_found
    - jira_current_user_failed
    - owner_mismatch
    - assignee_mismatch
    - agent_ownership_conflict
    - unknown_jira_status
    - operation_contract_not_found
    - operation_contract_load_failed
    - operation_stage_not_allowed
    - run_not_found
    - workspace_mismatch
    - local_state_mismatch
    - run_issue_mismatch
    - real_jira_confirmation_required
    - jira_description_write_failed
    - event_write_failed
    - jira_write_completed_audit_failed
side_effects:
  - may_update_jira_description
  - preserves_unmapped_description_content
  - writes_local_audit_intent_before_jira
  - writes_local_audit_completion_after_jira
  - must_not_modify_code
human_gate:
  required: true
retry_policy:
  retryable: false
  max_attempts: 0
  redo_from_stage: jira_write_gate
redo_from_stage: jira_write_gate
