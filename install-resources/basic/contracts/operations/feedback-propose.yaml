operation: feedback_propose
version: 1
purpose: 根据失败与结构化恢复证据生成包含恢复计数和外部证据引用的改进建议，不自动修改 AgenticOps 标准资产。
task_type: feedback_proposal
allowed_stages:
  - evidence_written
  - blocked
  - completed
required_inputs:
  - workspace
input:
  workspace:
    type: string
    required: true
  date:
    type: string
    required: false
  agentic_run_id:
    type: string
    required: false
  issue_key:
    type: string
    required: false
  task_type:
    type: string
    required: false
  code:
    type: string
    required: false
  from:
    type: string
    required: false
  to:
    type: string
    required: false
preconditions:
  - workspace_must_be_initialized
  - feedback_events_must_be_readable
output:
  workspace:
    type: string
  scope:
    type: string
  proposals:
    type: object
  proposal_report:
    type: string
  agentic_next_action:
    type: string
failure:
  codes:
    - workspace_root_failed
    - event_read_failed
    - invalid_filter
    - report_write_failed
side_effects:
  - may_write_workspace_feedback
  - must_not_write_jira
  - must_not_write_github
  - must_not_modify_agenticops_rules
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: evidence_written
redo_from_stage: evidence_written
