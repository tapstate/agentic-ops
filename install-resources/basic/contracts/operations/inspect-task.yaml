operation: inspect_task
version: 1
purpose: 只读检查 Jira 任务事实、通用门禁事实和项目资产引用，供 AIAgent 按标准资产判断下一步。
task_type: task_inspection
allowed_stages:
  - waiting_takeover
  - takeover_gate
required_inputs:
  - issue_key
  - workspace
input:
  issue_key:
    type: string
    required: true
  workspace:
    type: string
    required: true
preconditions:
  - jira_issue_must_be_readable
output:
  workspace:
    type: string
  issue_key:
    type: string
  issue:
    type: object
  current_jira_user:
    type: string
  target_repo:
    type: string
  form_values:
    type: object
  gate_facts:
    type: object
  asset_refs:
    type: object
  recommended_next_action:
    type: string
    enum:
      - inspect_by_agent
failure:
  codes:
    - missing_issue_key
    - jira_adapter_config_failed
    - jira_issue_read_failed
    - issue_not_found
    - jira_current_user_failed
side_effects:
  - must_not_write_jira
  - must_not_create_takeover_record
  - must_not_modify_code
  - must_not_create_pr
human_gate:
  required: false
retry_policy:
  retryable: false
  max_attempts: 0
  redo_from_stage: takeover_gate
redo_from_stage: takeover_gate
