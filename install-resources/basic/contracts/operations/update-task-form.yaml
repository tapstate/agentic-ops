operation: update_task_form
version: 1
purpose: 按项目 profile 的逻辑字段映射更新 Jira 结构化表单字段。
task_type: jira_write
allowed_stages:
  - takeover_gate
  - implementation
  - completed
required_inputs:
  - issue_key
  - workspace
  - values_file
input:
  issue_key:
    type: string
    required: true
  workspace:
    type: string
    required: true
  values_file:
    type: string
    required: true
  run_id:
    type: string
    required: false
preconditions:
  - current_user_must_match_owner_and_assignee
  - current_agent_id_must_be_empty_or_match_agent_id
  - run_id_must_match_issue_when_provided
  - logical_fields_must_map_to_jira_fields
  - logical_fields_must_be_explicitly_writable
  - real_jira_write_must_be_confirmed
output:
  workspace:
    type: string
  issue_key:
    type: string
  run_id:
    type: string
  updated_field_count:
    type: integer
  current_stage:
    type: string
  next_action:
    type: string
failure:
  codes:
    - missing_issue_key
    - missing_values_file
    - values_file_read_failed
    - empty_form_values
    - form_field_not_writable
    - jira_adapter_config_failed
    - jira_issue_read_failed
    - issue_not_found
    - jira_current_user_failed
    - owner_mismatch
    - assignee_mismatch
    - agent_ownership_conflict
    - unknown_jira_status
    - operation_contract_not_found
    - operation_contract_load_failed
    - operation_stage_not_allowed
    - run_not_found
    - workspace_mismatch
    - local_state_mismatch
    - run_issue_mismatch
    - real_jira_confirmation_required
    - jira_form_write_failed
    - event_write_failed
    - jira_write_completed_audit_failed
side_effects:
  - may_update_mapped_jira_fields
  - rejects_non_writable_comment_description_and_ownership_mappings
  - writes_local_audit_intent_before_jira
  - writes_local_audit_completion_after_jira
  - must_not_modify_code
human_gate:
  required: true
retry_policy:
  retryable: false
  max_attempts: 0
  redo_from_stage: jira_write_gate
redo_from_stage: jira_write_gate
