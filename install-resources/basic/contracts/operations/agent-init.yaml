operation: agent_init
version: 1
purpose: 初始化 AIAgent 在当前工作空间内可使用的能力说明。
task_type: capability_initialization
allowed_stages:
  - workspace_initialized
required_inputs: []
input:
  workspace:
    type: string
    required: false
preconditions:
  - workspace_must_be_initialized
output:
  workspace:
    type: string
  task_type:
    type: string
  current_stage:
    type: string
  next_action:
    type: string
  capabilities:
    type: array
failure:
  codes:
    - workspace_not_initialized
    - capability_init_failed
side_effects:
  - may_write_workspace_state
  - must_not_modify_code
human_gate:
  required: false
retry_policy:
  retryable: true
  max_attempts: 1
  redo_from_stage: workspace_initialized
redo_from_stage: workspace_initialized
