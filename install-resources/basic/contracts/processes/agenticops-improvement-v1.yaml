process_id: agenticops_improvement_v1
task_classes:
  - process_improvement
entry_stage: waiting_takeover
stages:
  - id: waiting_takeover
    responsible_role: development_engineer
    input_fields:
      - assignee
      - task_class
      - target_repo
      - verification_method
    output_fields:
      - run_id
      - current_agent_id
      - takeover_at
      - current_stage
      - next_action
    review_gate: null
  - id: implementation
    responsible_role: ai_agent
    output_fields:
      - improvement_summary
      - changed_assets
      - verification_result
    review_gate: development_engineer_review
  - id: completed
    responsible_role: development_engineer
    completion_cleanup:
      clear_current_agent_id: true
