process_id: agenticops_improvement_v1
task_classes:
  - process_improvement
entry_stage: waiting_takeover
stages:
  - id: waiting_takeover
    responsible_role: development_engineer
    input_fields:
      - assignee
      - task_class
      - target_repo
      - verification_method
    output_fields:
      - agentic_run_id
      - agentic_id
      - agentic_takeover_at
      - agentic_heartbeat_at
      - current_stage
      - agentic_next_action
    review_gate: null
  - id: implementation
    responsible_role: ai_agent
    output_fields:
      - improvement_summary
      - changed_assets
      - verification_result
    review_gate: development_engineer_review
  - id: completed
    responsible_role: development_engineer
    completion_cleanup:
      clear_agentic_id: true
