schema_version: 1
default_target_branch: develop

protected_branches:
  - main

commit_review_branches:
  - develop

pr_review_branches:
  - pattern: '^[^/]+/AO-[1-9][0-9]*/fix-main$'
    target_branch: main
  - pattern: '^(feature|fix)/AO-[1-9][0-9]+([-/].+)?$'
    target_branch: develop
  - pattern: '^(?!(?:feature|fix)/)[^/]+/AO-[1-9][0-9]+([-/].+)?$'
    target_branch: develop
  - pattern: '^[^/]+/AO-[1-9][0-9]+/(?!fix-main$).+$'
    target_branch: develop

special_branch_patterns:
  - pattern: '^release/.+$'
    target_branch: main
