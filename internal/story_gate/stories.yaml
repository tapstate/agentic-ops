schema_version: 1

story_categories:
  - internal
  - product

stories:
  - story_id: INT-001
    category: internal
    title: 审查并发布 AgenticOps
    document: docs/user-stories/v1/int-001-release-governance.md
    protected_paths:
      - .agentic-ops-source
      - .gitignore
      - .local/.gitkeep
      - .githooks/**
      - .github/**
      - AGENTS.md
      - README.md
      - docs/**
      - internal/**
      - bin/**
      - developer/**
      - maintainer/**
      - shared/**
      - skills/**
    acceptance_checks: [python_runtime, resource_contracts, release_workflow, story_registry]
    evidence_requirements:
      - 产品验证、故事映射和发布门禁结果
      - main、develop 与版本 Tag 的发布后回读

  - story_id: PROD-001
    category: product
    title: 安装并接入多种 Agent
    document: docs/user-stories/v1/prod-001-install-and-connect-agent.md
    protected_paths: [agenticops, adapters/**, bootstrap/**, contracts/**, tests/test_install.sh, tests/test_adapter_boundary.py, tests/test_contracts.py, tests/test_workspace_compatibility.py]
    acceptance_checks: [python_runtime, resource_contracts]
    evidence_requirements:
      - macOS 与 Linux 的轻依赖安装边界
      - 工作目录初始化、更新和回退结果

  - story_id: PROD-002
    category: product
    title: 执行确定性流程检查点
    document: docs/user-stories/v1/prod-002-policy-gate.md
    protected_paths: [gate/**, policies/**, adapters/runtime.py, adapters/tools/**, docs/security/**, tests/test_gate.py, tests/test_contracts.py]
    acceptance_checks: [python_runtime, resource_contracts]
    evidence_requirements:
      - 流程检查点、旧 run 拒绝、重复推进与确认绑定校验结果
      - 新工作空间无通用 Hook、旧接线显式迁移与原生工具边界

  - story_id: PROD-003
    category: product
    title: 推进并恢复多仓库研发任务
    document: docs/user-stories/v1/prod-003-multi-repository-task.md
    protected_paths: [workflow/**, tests/test_workflow.py, tests/test_repair_strategy.py, tests/test_repository_recovery.py, tests/test_checkpoints.py, tests/test_quality.py, tests/test_issue_versions.py, tests/test_jira_status.py, tests/test_jira_watermark.py, tests/test_git_refs.py]
    acceptance_checks: [python_runtime, resource_contracts]
    evidence_requirements:
      - 阶段、准入、授权、pending 和恢复结果
      - 多仓库绑定、分仓 PR/CI 与任务级证据

  - story_id: PROD-004
    category: product
    title: 低成本适配产品项目
    document: docs/user-stories/v1/prod-004-adapt-project.md
    protected_paths: [projects/**]
    acceptance_checks: [python_runtime, resource_contracts]
    evidence_requirements:
      - 项目 Profile、准入规则和生成视图一致性
      - 未登记项目事实的保守停止结果
